<script>
/* Núcleo de widgets: un solo archivo para el blog y para las slides.

   y se registra con OTK.register('nombre', fn). El núcleo detecta si corre dentro de Reveal. */
(function () {
  const C = { navy: '#16213e', blue: '#0f3460', text: '#1a1a2e', red: '#e94560', coral: '#f28482', coralD: '#ce5553',

  const FONT = "'Poppins', 'Helvetica Neue', sans-serif";
  const enReveal = () => !!document.querySelector('.reveal .slides');

  function setupCanvas(cv) {
    const W = +cv.getAttribute('width'), H = +cv.getAttribute('height');
    const r = 3;
    cv.width = W * r; cv.height = H * r;
    cv.style.aspectRatio = W + ' / ' + H;
    const ctx = cv.getContext('2d');
    ctx.setTransform(r, 0, 0, r, 0, 0);
    return { ctx, W, H };
  }
  function text(ctx, s, x, y, opt = {}) {
    ctx.fillStyle = opt.color || C.text;
    ctx.font = (opt.italic ? 'italic ' : '') + (opt.weight || '400') + ' ' + (opt.size || 17) + 'px ' + FONT;
    ctx.textAlign = opt.align || 'left'; ctx.textBaseline = opt.base || 'alphabetic';
    ctx.fillText(s, x, y);
  }
  // ------------------------------------------------------------ fórmulas: LaTeX compilado a SVG (widgets/tex.html)
  // tex(ctx, '\\hat s_y', x, y, opt) dibuja la fórmula con su línea de base en y; rich() mezcla texto y $fórmulas$.
  const TEXIMG = {};
  function rgbaDe(c) {
    if (!c) return ['rgb(26,26,46)', 1];
    if (c[0] === '#') {
      let h = c.slice(1); if (h.length <= 4) h = [...h].map(x => x + x).join('');
      const v = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
      return [`rgb(${v[0]},${v[1]},${v[2]})`, h.length >= 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
    }
    const m = c.match(/rgba?\(([^)]+)\)/); if (!m) return [c, 1];
    const v = m[1].split(',').map(x => x.trim()); return [`rgb(${v[0]},${v[1]},${v[2]})`, v[3] !== undefined ? +v[3] : 1];
  }
  function texInfo(src) { return (window.OTK_TEX || {})[src]; }
  function texAncho(src, size) { const T = texInfo(src); return T ? T.w / 1000 * size * 1.16 : 0; }
  function tex(ctx, src, x, y, opt = {}) {
    const T = texInfo(src); if (!T) { console.warn('fórmula sin compilar:', src); return 0; }
    if (rgbaDe(opt.color)[1] <= 0.01) return T.w / 1000 * (opt.size || 17) * 1.16;
    const size = (opt.size || 17) * 1.16, [rgb, a] = rgbaDe(opt.color || C.text), key = src + '|' + rgb;
    let img = TEXIMG[key];
    if (!img) {
      img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(T.svg.replace('<svg ', `<svg style="color:${rgb}" `));

    }

    let x0 = opt.align === 'center' ? x - w / 2 : opt.align === 'right' ? x - w : x;
    if (img.complete && img.naturalWidth) { const ga = ctx.globalAlpha; ctx.globalAlpha = ga * a; ctx.drawImage(img, x0, y + T.y / 1000 * size, w, h); ctx.globalAlpha = ga; }

  }
  function rich(ctx, s, x, y, opt = {}) {
    if (!s.includes('$')) { text(ctx, s, x, y, opt); ctx.font = (opt.weight || '400') + ' ' + (opt.size || 17) + 'px ' + FONT; return ctx.measureText(s).width; }
    const partes = s.split('$'), size = opt.size || 17, fnt = (opt.italic ? 'italic ' : '') + (opt.weight || '400') + ' ' + size + 'px ' + FONT;
    const anchos = partes.map((p, i) => { if (i % 2) return texAncho(p, size); ctx.font = fnt; return ctx.measureText(p).width; });
    const total = anchos.reduce((a, b) => a + b, 0);
    let x0 = opt.align === 'center' ? x - total / 2 : opt.align === 'right' ? x - total : x;
    partes.forEach((p, i) => { if (i % 2) tex(ctx, p, x0, y, { ...opt, align: 'left' }); else if (p) text(ctx, p, x0, y, { ...opt, align: 'left' }); x0 += anchos[i]; });
    return total;
  }
  // texto partido en renglones que entran en un ancho dado
  function parrafo(ctx, s, x, y, ancho, opt = {}) {
    const lh = opt.lh || (opt.size || 17) * 1.35;
    ctx.font = (opt.weight || '400') + ' ' + (opt.size || 17) + 'px ' + FONT;
    let linea = '', n = 0;
    for (const w of s.split(' ')) {
      const prueba = linea ? linea + ' ' + w : w;
      if (ctx.measureText(prueba).width > ancho && linea) { text(ctx, linea, x, y + n * lh, opt); linea = w; n++; }
      else linea = prueba;
    }
    if (linea) { text(ctx, linea, x, y + n * lh, opt); n++; }
    return n;
  }
  function dot(ctx, x, y, color, r = 6) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  function caja(ctx, x, y, w, h, opt = {}) {
    const r = opt.r === undefined ? 10 : opt.r;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    if (opt.fill) { ctx.fillStyle = opt.fill; ctx.fill(); }
    if (opt.stroke) { ctx.strokeStyle = opt.stroke; ctx.lineWidth = opt.lw || 2; ctx.setLineDash(opt.dash || []); ctx.stroke(); ctx.setLineDash([]); }
  }
  // flecha por una poligonal de puntos [[x,y],…]; opt.t ∈ [0,1] dibuja sólo una parte
  function flecha(ctx, pts, color, opt = {}) {
    const lw = opt.lw || 2.5, t = opt.t === undefined ? 1 : opt.t;
    if (t <= 0) return;
    const seg = []; let total = 0;
    for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); total += l; }
    let resto = total * t, fin = pts[0], dir = [1, 0];
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.setLineDash(opt.dash || []);
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length && resto > 0; i++) {
      const k = Math.min(1, resto / seg[i - 1]);
      fin = [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k];
      dir = [(pts[i][0] - pts[i - 1][0]) / seg[i - 1], (pts[i][1] - pts[i - 1][1]) / seg[i - 1]];
      ctx.lineTo(fin[0], fin[1]); resto -= seg[i - 1];
    }
    ctx.stroke(); ctx.setLineDash([]);
    if (opt.punta !== false) {
      const a = opt.cabeza || 9, nx = -dir[1], ny = dir[0];
      ctx.fillStyle = color; ctx.beginPath();
      ctx.moveTo(fin[0] + dir[0] * a * 0.5, fin[1] + dir[1] * a * 0.5);
      ctx.lineTo(fin[0] - dir[0] * a + nx * a * 0.6, fin[1] - dir[1] * a + ny * a * 0.6);
      ctx.lineTo(fin[0] - dir[0] * a - nx * a * 0.6, fin[1] - dir[1] * a - ny * a * 0.6);
      ctx.closePath(); ctx.fill();
    }
  }
  // punto a una fracción u ∈ [0,1] de una poligonal (para partículas que viajan por las flechas)
  function sobre(pts, u) {
    const seg = []; let total = 0;
    for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); total += l; }
    let d = total * Math.min(1, Math.max(0, u));
    for (let i = 1; i < pts.length; i++) {
      if (d <= seg[i - 1] || i === pts.length - 1) { const k = seg[i - 1] ? Math.min(1, d / seg[i - 1]) : 0;
        return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k]; }
      d -= seg[i - 1];
    }
    return pts[pts.length - 1];
  }
  const ease = r => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, r)));
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const alfa = (hex, a) => hex + Math.round(clamp(a, 0, 1) * 255).toString(16).padStart(2, '0');

  function mulberry(a) {
    return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function gauss(r) { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }

  // ------------------------------------------------------------ controles
  const ICON_PAUSE = '<svg viewBox="0 0 16 16" width="14" height="14"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
  const ICON_PLAY = '<svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 2.2v11.6c0 .6.7 1 1.2.6l8.6-5.8c.4-.3.4-.9 0-1.2L5.2 1.6C4.7 1.2 4 1.6 4 2.2z"/></svg>';
  const ICON_RESET = '<svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2.5a5.5 5.5 0 1 1-5.3 7h1.6A4 4 0 1 0 5.2 5.2L7 7H2V2l2.1 2.1A5.5 5.5 0 0 1 8 2.5z"/></svg>';
  function bar(root) {
    const b = document.createElement('div'); b.className = 'ot-controls ot-controls-wrap'; root.appendChild(b); return b;
  }
  function iconButton(parent, icon, label, onClick) {
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'ot-play';
    btn.innerHTML = icon; btn.setAttribute('aria-label', label); btn.title = label;
    btn.addEventListener('click', onClick); parent.appendChild(btn); return btn;
  }
  function textButton(parent, label, onClick) {
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'ot-btn';
    btn.textContent = label; btn.addEventListener('click', onClick); parent.appendChild(btn); return btn;
  }
  // grupo de botones excluyentes; devuelve una función para fijar el activo desde afuera
  function opciones(parent, items, start, onChange) {
    const g = document.createElement('span'); g.className = 'ot-grupo'; g.setAttribute('role', 'group'); parent.appendChild(g);
    const btns = items.map(([val, label]) => {
      const b = textButton(g, label, () => { set(val); onChange(val); }); b.dataset.val = val; return b;
    });
    function set(val) { btns.forEach(b => { const on = b.dataset.val === String(val); b.classList.toggle('activo', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }); }
    set(start); return set;
  }
  function choice(parent, label, values, start, fmt, onChange) {
    const wrap = document.createElement('label'); wrap.className = 'ot-field';
    const name = document.createElement('span'); name.innerHTML = label;
    const rng = document.createElement('input'); rng.type = 'range'; rng.min = 0; rng.max = values.length - 1; rng.step = 1;
    rng.value = Math.max(0, values.indexOf(start));
    const val = document.createElement('b'); val.textContent = fmt(values[+rng.value]);
    rng.addEventListener('input', () => { val.textContent = fmt(values[+rng.value]); onChange(values[+rng.value]); });
    // dentro de Reveal las flechas del teclado mueven el deslizador, no la slide
    rng.addEventListener('keydown', ev => ev.stopPropagation());
    wrap.append(name, rng, val); parent.appendChild(wrap); return rng;
  }
  function interruptor(parent, label, start, onChange) {
    const wrap = document.createElement('label'); wrap.className = 'ot-field ot-check';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = start;
    const name = document.createElement('span'); name.innerHTML = label;
    cb.addEventListener('change', () => onChange(cb.checked));
    wrap.append(cb, name); parent.appendChild(wrap); return cb;
  }
  function readout(parent) {
    const s = document.createElement('span'); s.className = 'ot-readout'; parent.appendChild(s); return s;
  }
  function hint(parent, s) {
    const h = document.createElement('span'); h.className = 'ot-hint'; h.textContent = s; parent.appendChild(h); return h;
  }

  // ------------------------------------------------------------ bucle único de animación
  // frame(root, cb): cb(now, dt) se llama en cada cuadro mientras el widget está a la vista.
  // root._entrar(), si existe, se llama cada vez que el widget vuelve a estar a la vista.
  const marcos = [];
  function frame(root, cb) { const M = { root, cb, visible: false, last: 0 }; marcos.push(M); return M; }
  function aLaVista(root) {
    const sec = root.closest('.reveal .slides section');
    if (sec) return sec.classList.contains('present');
    const r = root.getBoundingClientRect(), vh = window.innerHeight || document.documentElement.clientHeight;

    for (const M of marcos) {
      const v = aLaVista(M.root);
      if (v && !M.visible) { M.last = now; if (M.root._entrar) M.root._entrar(now); }
      M.visible = v;
      if (!v) continue;
      const dt = Math.min(80, now - M.last); M.last = now;
      M.cb(now, dt);

  }
  // loop: el parámetro va de lo a hi, se detiene un momento y vuelve a empezar; con pausa y deslizador
  function loop(root, lo, hi, draw, dur = 4200, holdEnd = 1400, holdStart = 500) {
    const L = { start: performance.now(), paused: false, s: 0 };
    const b = document.createElement('div'); b.className = 'ot-controls';
    const btn = iconButton(b, ICON_PAUSE, 'Pausar', () => {
      L.paused = !L.paused;
      if (!L.paused) L.start = performance.now() - (holdStart + Math.acos(1 - 2 * L.s) / Math.PI * dur);

    });

    rng.addEventListener('keydown', ev => ev.stopPropagation());
    rng.addEventListener('input', () => { L.paused = true; sync(); L.s = rng.value / 1000; draw(lo + (hi - lo) * L.s); });

      if (L.paused) return;
      const e = (now - L.start) % (holdStart + dur + holdEnd);
      L.s = ease((e - holdStart) / dur); rng.value = Math.round(L.s * 1000);
      draw(lo + (hi - lo) * L.s);
    });
    draw(lo);
    return L;
  }

  // pasos: la animación avanza por partes. stops = valores del parámetro donde se detiene
  // (el primero es el estado inicial). En Reveal cada paso es un fragment (se crean solos);
  // en el blog se avanza con los botones o con un clic sobre la figura (sin textos de ayuda).
  let hayQueSincronizar = false;
  function pasos(root, stops, draw, opt = {}) {
    const P = { i: 0, t: stops[0], from: stops[0], to: stops[0], t0: 0, dur: 0, stops, nMax: opt.nMax || stops.length - 1 };
    const sec = root.closest('.reveal .slides section');
    if (sec && !sec.querySelector('.fragment.paso')) {
      const cont = document.createElement('div'); cont.className = 'pasos-frag'; cont.setAttribute('aria-hidden', 'true');
      for (let k = 0; k < P.nMax; k++) { const f = document.createElement('span'); f.className = 'fragment paso'; cont.appendChild(f); }
      sec.appendChild(cont); hayQueSincronizar = true;
    }
    const b = document.createElement('div'); b.className = 'ot-controls ot-pasos';
    const ant = textButton(b, '← Anterior', () => { if (sec && window.Reveal) Reveal.prevFragment(); else va(P.i - 1); });
    const sig = textButton(b, 'Siguiente →', () => { if (sec && window.Reveal && P.i < P.nMax) Reveal.nextFragment(); else va(P.i >= P.stops.length - 1 ? 0 : P.i + 1); });
    const puntos = document.createElement('span'); puntos.className = 'ot-puntos'; b.appendChild(puntos);
    root.appendChild(b);
    const cv = root.querySelector('canvas');
    if (cv && !sec) { cv.style.cursor = 'pointer'; cv.addEventListener('click', ev => { if (ev.target === cv && !cv.classList.contains('arrastrable')) sig.click(); }); }
    function pinta() {
      const n = P.stops.length - 1;
      puntos.innerHTML = [...Array(n + 1)].map((_, k) => `<i class="${k === P.i ? 'on' : k < P.i ? 'ya' : ''}"></i>`).join('');
      ant.disabled = P.i === 0; sig.textContent = P.i >= n ? '↺ Desde el principio' : 'Siguiente →';
    }
    function va(n, inmediato) {
      n = clamp(n, 0, P.stops.length - 1);
      const adelante = n === P.i + 1 && !inmediato;
      P.from = adelante ? P.stops[P.i] : P.stops[n]; P.to = P.stops[n]; P.i = n;
      P.t0 = performance.now(); P.dur = adelante ? clamp(Math.abs(P.to - P.from) * (opt.ms || 9000), 600, opt.max || 2600) : 0;
      if (!P.dur) P.t = P.to;
      pinta();
    }
    P.va = va; root._pasos = P;
    P.setStops = (st) => { P.stops = st; va(Math.min(P.i, st.length - 1), true); };
    root._sync = () => { if (sec) va(Math.min(P.stops.length - 1, sec.querySelectorAll('.fragment.paso.visible').length), !sec.classList.contains('present')); };
    frame(root, now => {
      if (P.dur) { const u = clamp((now - P.t0) / P.dur, 0, 1); P.t = P.from + (P.to - P.from) * ease(u); if (u >= 1) P.dur = 0; }
      draw(P.t, now);
    });
    pinta(); draw(P.t, performance.now());
    return P;
  }

  const REG = {};
  window.OTK = {
    C, FONT, enReveal, setupCanvas, text, tex, rich, parrafo, dot, caja, flecha, sobre, ease, clamp, alfa, mulberry, gauss,
    bar, iconButton, textButton, opciones, choice, interruptor, readout, hint, frame, loop, pasos,
    ICON_PAUSE, ICON_PLAY, ICON_RESET,
    register(name, fn) { REG[name] = fn; }
  };

  function init() {
    document.querySelectorAll('.ot-widget').forEach(root => {
      const f = REG[root.dataset.widget];
      if (!f) { console.warn('widget sin registrar:', root.dataset.widget); return; }
      const cv = root.querySelector('canvas');
      if (cv && !cv.getAttribute('aria-label') && root.dataset.alt) { cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', root.dataset.alt); }
      f(root);
    });
    requestAnimationFrame(tick);
    if (window.Reveal) {
      // los widgets que avanzan con los fragments de la slide se sincronizan acá
      const sync = () => document.querySelectorAll('.reveal .slides section.present .ot-widget').forEach(r => r._sync && r._sync());
      const engancha = () => { if (hayQueSincronizar) Reveal.sync(); ['slidechanged', 'fragmentshown', 'fragmenthidden'].forEach(e => Reveal.on(e, sync)); sync(); };
      if (Reveal.isReady && Reveal.isReady()) engancha(); else Reveal.on('ready', engancha);
      return;
    }
    // sólo en el documento: aparición suave de cajas y figuras
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce && 'IntersectionObserver' in window) {
      const fade = new IntersectionObserver(entries => {
        for (const en of entries) if (en.isIntersecting) { en.target.classList.add('visto'); fade.unobserve(en.target); }
      }, { threshold: 0.08 });
      document.querySelectorAll('main .caja, main .quarto-figure, main .ot-widget, main figure.original')
        .forEach(el => { el.classList.add('aparece'); fade.observe(el); });
    }
  }
  function progress() {
    const b = document.getElementById('lectura');
    if (!b) return;
    if (enReveal()) { b.style.display = 'none'; return; }
    const h = document.documentElement;
    b.style.transform = 'scaleX(' + clamp(h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight), 0, 1) + ')';
  }
  window.addEventListener('scroll', progress, { passive: true });
  // los widgets se registran en archivos que se incluyen después: se inicializa cuando terminó de cargar todo
  function boot() { init(); progress(); }
  if (document.readyState === 'complete') boot(); else window.addEventListener('load', boot);
})();
</script>
