<script>
/* m-perdema: Paso 6 (la pérdida) y Paso 7 (la actualización por EMA) en SVG + GSAP, sobre widgets/anim.html.
   Reemplazan a los widgets 'perdida' y 'ema' de widgets/pasos.html (se registran con el mismo nombre,
   después). Los números y las trayectorias son los mismos que en la versión en canvas.

   perdida — paradas (una idea por parada):
     s0 un parche: vector predicho y objetivo · s1 la distancia D(ŝ_y, s_y)
     s2 su valor viaja al bloque; aparecen los otros 5 parches · s3 promedio del bloque
     s4 viaja a la imagen; aparecen los otros 3 bloques · s5 promedio de la imagen
     s6 viaja al lote; aparecen las otras imágenes · s7 promedio del lote: la pérdida L
     s8 el gradiente de L llega al predictor y al encoder de contexto; s_y no recibe gradiente
   ema — paradas:
     s0 inicio · s1 θ se mueve por gradiente, con ruido · s2 la fórmula del promedio móvil, por piezas
     s3 m = 0,9 · s4 m = 0,996 · s5 m de 0,996 a 1 (I-JEPA), con el recuadro de m durante el entrenamiento */
(function () {
  const K = window.OTK, A = window.OTA, C = A.C, G = A.G;
  const el = A.el, tr = A.tr;
  const n2 = v => v.toFixed(2).replace('.', ',');
  const prom = a => a.reduce((s, v) => s + v, 0) / a.length;
  // las claves con signos de pesos se escriben así para que scripts/compilar_tex.mjs las encuentre
  function limpiar(o) { const r = {}; for (const k in o) r[k] = o[k].slice(1, -1); return r; }
  // número como <text> centrado en (0,0) y ubicado con transform: así una copia puede viajar y escalar
  function numero(padre, s, x, y, o = {}) {
    const t = el('text', { x: 0, y: 0, 'text-anchor': 'middle', 'font-size': o.size || 20, 'font-weight': o.weight || '600', fill: o.color || C.navy,
      transform: tr(x, y) }, padre);
    t.textContent = s; t.pos = { x, y, size: o.size || 20 };
    return t;
  }

  // ============================================================ Paso 6: la pérdida
  K.register('perdida', root => {
    const S = A.svg(root, 1280, 500);
    A.cuandoFuentes(() => perdida(root, S));
  });

  function perdida(root, S) {
    // ---------------------------------------------------------------- datos (los de la versión en canvas)
    const OB = G.OBJK[0], r = K.mulberry(21);
    const T = OB.map(k => G.VAL2[k]);
    const P = T.map(v => v.map(x => A.clamp(x + (r() - 0.5) * 0.5, 0, 1)));
    const D = T.map((v, j) => v.reduce((a, x, c) => a + (P[j][c] - x) ** 2, 0));
    const mB = prom(D), BLQ = [mB, 0.21, 0.34, 0.18], mI = prom(BLQ);
    const LOTE = [mI, ...[...Array(11)].map(() => 0.16 + 0.22 * r())], mL = prom(LOTE);

    // ---------------------------------------------------------------- geometría
    const CX = [20, 340, 660, 985];            // borde izquierdo de cada columna
    const YR = 380;                            // línea de base de los resultados de cada nivel
    const head = A.encabezado(S, 6, [
      'Por parche: el vector predicho $\\hat s_y$ y su objetivo $s_y$, de 8 números cada uno',
      'Por parche: la distancia $D(\\hat s_y, s_y)$ entre el vector predicho y su objetivo',
      'Por bloque: cada uno de sus 6 parches aporta su distancia',
      'Por bloque: se promedian las distancias de sus parches',
      'Por imagen: cada uno de los M bloques objetivo aporta su promedio (4 en el paper)',
      'Por imagen: se promedian los M bloques objetivo',
      'Por lote: cada imagen del lote aporta su valor',
      'Por lote: se promedia sobre todas las imágenes. Ese número es la pérdida',
      'La pérdida $L$ es un solo número por lote: de ahí sale el gradiente'
    ]);
    head.set(0);

    const cols = CX.map(() => el('g', {}, S));
    cols.forEach((g, k) => { if (k) g.style.opacity = 0; });
    const TIT = ['un parche', 'un bloque', 'una imagen', 'el lote'];
    CX.forEach((x, k) => {
      el('rect', { x, y: 70, width: 28, height: 28, rx: 7, fill: C.blue }, cols[k]);
      const t = el('text', { x: x + 14, y: 90, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 600, fill: '#fff' }, cols[k]); t.textContent = k + 1;
      A.texto(cols[k], TIT[k], x + 40, 91, { size: 21, weight: '600', color: C.navy });
    });
    const flechas = [[296, 334], [600, 650], [866, 966]].map(([a, b]) => {
      const f = A.flecha(S, [[a, 214], [b, 214]], C.grey, { lw: 2.2 });
      f.setAttribute('stroke-dasharray', '1 1'); f.setAttribute('stroke-dashoffset', 1);
      f._punta = f.getAttribute('marker-end'); f.setAttribute('marker-end', 'none');   // la punta aparece al final del trazo
      return f;
    });

    // ---- 1. un parche: dos vectores de 8 números como barras
    const g1 = cols[0], X1 = CX[0], BL = 110, BY = 146, BH = 24;
    A.texto(g1, 'predicción $\\hat s_y$', X1, 132, { size: 18, weight: '600', color: C.blue });
    A.texto(g1, 'objetivo $s_y$', X1 + 140, 132, { size: 18, weight: '600', color: C.coralD });
    const barP = P[0].map((v, c) => el('rect', { x: X1, y: BY + c * BH, width: Math.max(1.5, BL * v), height: 16, rx: 2, fill: C.blue, 'fill-opacity': 0.8 }, g1));
    const barT = T[0].map((v, c) => el('rect', { x: X1 + 140, y: BY + c * BH, width: Math.max(1.5, BL * v), height: 16, rx: 2, fill: 'none', stroke: C.coralD, 'stroke-width': 1.8 }, g1));
    const dif = P[0].map((v, c) => { const a = Math.min(v, T[0][c]), b = Math.max(v, T[0][c]);
      const d = el('rect', { x: X1 + 2 * BL * a, y: BY + c * BH + 5, width: Math.max(1.5, 2 * BL * (b - a)), height: 6, rx: 1.5, fill: C.navy }, g1);
      d.style.opacity = 0; return d; });
    const F1 = A.formula(g1, limpiar({ D: '$D$', lp: '$($', sh: '$\\hat s_y$', co: '$,$', sy: '$s_y$', rp: '$)$', eq: '$=$' }),
      [[], ['D'], ['D', 'lp', 'sh', 'co', 'sy', 'rp'], ['D', 'lp', 'sh', 'co', 'sy', 'rp', 'eq']],
      { cx: 0, y: YR, size: 24, gap: { eq: 8, co: 2 }, color: { D: C.navy, lp: C.navy, rp: C.navy, sh: C.blue, sy: C.coralD, co: C.navy, eq: C.text } });
    F1.set(0);
    const p3 = F1.pos(3), izq = p3.D, der = p3.eq + F1.nodos.eq.ancho + 8;
    F1.g.setAttribute('transform', tr(X1 - izq, 0));
    const v1 = numero(g1, n2(D[0]), X1 + (der - izq) + 6 + A.medir(n2(D[0]), 24, '600') / 2, YR, { size: 24 });
    v1.style.opacity = 0;
    const nota1 = [A.texto(g1, 'paper: L2 al cuadrado', X1, 414, { size: 17, color: C.grey2 }), A.texto(g1, 'código: smooth L1', X1, 438, { size: 17, color: C.grey2 })];
    nota1.forEach(n => { n.style.opacity = 0; });

    // ---- 2. un bloque: sus 6 parches, cada uno con su distancia
    const g2 = cols[1], X2 = CX[1], CW = 76, CH = 64;
    const celda = j => ({ x: X2 + (j % 3) * (CW + 8), y: 126 + Math.floor(j / 3) * (CH + 8) });
    const items2 = OB.map((k, j) => {
      const c = celda(j), g = el('g', {}, g2);
      el('image', { href: A.parcheURL(k, G.N), x: c.x, y: c.y, width: CW, height: CH, preserveAspectRatio: 'none', opacity: 0.35 }, g);
      el('rect', { x: c.x, y: c.y, width: CW, height: CH, rx: 5, fill: 'none', stroke: C.coralD, 'stroke-width': j === 0 ? 2.8 : 1.5 }, g);
      const n = numero(g, n2(D[j]), c.x + CW / 2, c.y + CH / 2 + 7, { size: 20 });
      if (j > 0) g.style.opacity = 0; else n.style.opacity = 0;
      return { g, n };
    });
    const cap2 = A.texto(g2, 'promedio de los 6 parches', X2, 346, { size: 18, color: C.grey2 });
    const R2x = X2 + (3 * CW + 16) / 2;

    // ---- 3. una imagen: sus M = 4 bloques objetivo
    const g3 = cols[2], X3 = CX[2], IS = 180, IY = 118;
    el('image', { href: A.escenaURL(), x: X3, y: IY, width: IS, height: IS, preserveAspectRatio: 'none', opacity: 0.75 }, g3);
    el('rect', { x: X3, y: IY, width: IS, height: IS, rx: 3, fill: 'none', stroke: C.grid, 'stroke-width': 1.5 }, g3);
    const BB = [[0.55, 0.05, 0.4, 0.3], [0.05, 0.5, 0.3, 0.4], [0.4, 0.45, 0.32, 0.28], [0.12, 0.12, 0.3, 0.26]];
    const items3 = BB.map(([bx, by, bw, bh], b) => {
      const x = X3 + bx * IS, y = IY + by * IS, cx = x + bw * IS / 2, cy = y + bh * IS / 2, g = el('g', {}, g3);
      el('rect', { x, y, width: bw * IS, height: bh * IS, rx: 3, fill: C.coral, 'fill-opacity': 0.25, stroke: C.coralD, 'stroke-width': b === 0 ? 2.8 : 1.6 }, g);
      el('rect', { x: cx - 25, y: cy - 14, width: 50, height: 26, rx: 6, fill: '#fff', 'fill-opacity': 0.92 }, g);
      const n = numero(g, n2(BLQ[b]), cx, cy + 6, { size: 18 });
      if (b > 0) g.style.opacity = 0; else n.style.opacity = 0;
      return { g, n };
    });
    const cap3 = A.texto(g3, 'promedio de los $M = 4$ bloques', X3, 346, { size: 18, color: C.grey2 });
    const R3x = X3 + IS / 2;

    // ---- 4. el lote
    const g4 = cols[3], X4 = CX[3], TS = 60;
    const items4 = LOTE.map((v, b) => {
      const x = X4 + (b % 4) * (TS + 7), y = 116 + Math.floor(b / 4) * (TS + 7), g = el('g', {}, g4);
      el('image', { href: A.escenaURL(), x, y, width: TS, height: TS, preserveAspectRatio: 'none', opacity: 0.45 }, g);
      el('rect', { x, y, width: TS, height: TS, rx: 4, fill: 'none', stroke: b === 0 ? C.coralD : C.grid, 'stroke-width': b === 0 ? 2.6 : 1.3 }, g);
      const n = numero(g, n2(v), x + TS / 2, y + TS / 2 + 6, { size: 17 });
      if (b > 0) g.style.opacity = 0; else n.style.opacity = 0;
      return { g, n };
    });
    const cap4 = A.texto(g4, '… una imagen por ejemplo del lote', X4, 346, { size: 18, color: C.grey2 });
    const LB = { x: X4 - 4, y: 356, w: 4 * TS + 3 * 7 + 8, h: 46 };
    const caja4 = el('rect', { x: LB.x, y: LB.y, width: LB.w, height: LB.h, rx: 10, fill: C.navy }, g4);
    const txtL = A.texto(g4, 'pérdida $L$ =', LB.x + 22, YR, { size: 22, weight: '600', color: '#fff' });
    [caja4, txtL].forEach(e => { e.style.opacity = 0; });

    // resultados de los niveles 2 y 3 ('= valor')
    const resul = (g, x, v) => { const n = numero(g, n2(v), x, YR, { size: 24 });
      const eq = A.texto(g, '=', x - A.medir(n2(v), 24, '600') / 2 - 10, YR, { size: 24, weight: '600', color: C.text, anchor: 'end' });
      n.style.opacity = 0; eq.style.opacity = 0; return { n, eq }; };
    const res2 = resul(g2, R2x, mB), res3 = resul(g3, R3x, mI);
    const vL = numero(g4, n2(mL), LB.x + 22 + txtL.ancho + 8 + A.medir(n2(mL), 22, '600') / 2, YR, { size: 22, color: '#fff' }); vL.style.opacity = 0;
    [cap2, cap3, cap4].forEach(c => { c.style.opacity = 0; });

    // ---- s8: de dónde sale el gradiente
    const gGr = el('g', {}, S); gGr.style.opacity = 0;
    const caja = (x, y, w, h, s, col) => { const g = el('g', {}, gGr);
      el('rect', { x, y, width: w, height: h, rx: 14, fill: '#fff', stroke: col, 'stroke-width': 2.5 }, g);
      A.texto(g, s, x + w / 2, y + h / 2 + 7, { size: 20, weight: '600', color: col, anchor: 'middle' }); g.style.opacity = 0; return g; };
    const BX = [{ x: 40, y: 128 }, { x: 470, y: 128 }, { x: 40, y: 262 }, { x: 470, y: 262 }], BW = 330, BHh = 64;
    const cajas = [caja(BX[0].x, BX[0].y, BW, BHh, 'Encoder de contexto $f_\\theta$', C.teal), caja(BX[1].x, BX[1].y, BW, BHh, 'Predictor $g_\\phi$', C.blue),
      caja(BX[2].x, BX[2].y, BW, BHh, 'Encoder objetivo $f_{\\bar\\theta}$', C.navy), caja(BX[3].x, BX[3].y, BW, BHh, 'objetivos $s_y$', C.coralD)];
    const ida = [A.flecha(gGr, [[372, 150], [466, 150]], C.grey, { lw: 2 }), A.flecha(gGr, [[372, 294], [466, 294]], C.grey, { lw: 2 }),
      A.flecha(gGr, 'M802,150 C880,150 900,372 973,374', C.grey, { lw: 2 }), A.flecha(gGr, 'M802,294 C870,294 900,386 973,388', C.grey, { lw: 2 })];
    const grad = [A.flecha(gGr, 'M977,362 C910,300 880,178 806,176', C.navy, { lw: 3.2 }), A.flecha(gGr, [[468, 176], [376, 176]], C.navy, { lw: 3.2 })];
    [...ida, ...grad].forEach(f => { f.setAttribute('stroke-dasharray', '1 1'); f.setAttribute('stroke-dashoffset', 1);
      f._punta = f.getAttribute('marker-end'); f.setAttribute('marker-end', 'none'); });
    const trazaP = (tl, f, t, d) => { A.trazar(tl, f, t, d); tl.set(f, { attr: { 'marker-end': f._punta } }, t + d * 0.85); };
    const nab = [A.texto(gGr, '$\\nabla L$', 902, 250, { size: 22, color: C.navy }), A.texto(gGr, '$\\nabla L$', 422, 208, { size: 22, color: C.navy, anchor: 'middle' })];
    const cruz = el('g', {}, gGr);
    el('path', { d: 'M870,316 l20,20 M890,316 l-20,20', stroke: C.coralD, 'stroke-width': 4, 'stroke-linecap': 'round' }, cruz);
    A.texto(cruz, 'sin gradiente', 640, 358, { size: 18, weight: '600', color: C.coralD, anchor: 'middle' });
    [...nab, cruz].forEach(e => { e.style.opacity = 0; });

    // nota al pie
    const notas = A.rotulos(S, ['Como el código arma bloques del mismo tamaño en todo el lote, equivale a promediar todos los parches objetivo.',
      'Un solo número por lote. Su gradiente llega al predictor y al encoder de contexto; $s_y$ no recibe gradiente.'], { x: 20, y: 488, size: 18, color: C.grey2 });
    notas.set(0);

    // copias que viajan
    const vuelos = el('g', {}, S);
    const copia = (n, color) => { const t = el('text', { x: 0, y: 0, 'text-anchor': 'middle', 'font-size': n.pos.size, 'font-weight': '600', fill: color || C.navy,
      transform: tr(n.pos.x, n.pos.y) }, vuelos); t.textContent = n.textContent; t.style.opacity = 0; return t; };
    // un valor viaja de un nivel al siguiente y ocupa su lugar
    function viaja(tl, de, a, at, dur = 1.4) {
      const c = copia(de), s = a.pos.size / de.pos.size;
      tl.to(c, { opacity: 1, duration: 0.2 }, at)
        .to(c, { attr: { transform: tr(a.pos.x, a.pos.y, s) }, duration: dur, ease: 'power2.inOut' }, at)
        .to(a, { opacity: 1, duration: 0.25 }, at + dur - 0.15)
        .to(c, { opacity: 0, duration: 0.2 }, at + dur);
    }
    // el promedio absorbe los valores: cada uno viaja al resultado y se funde en él
    function absorbe(tl, items, dest, at, dur = 1.3) {
      const p1 = dest.pos;
      items.forEach((n, i) => {
        const c = copia(n), s = 0.55 * dest.pos.size / n.pos.size, t0 = at + i * 0.06;
        tl.to(c, { opacity: 1, duration: 0.15 }, t0)
          .to(c, { attr: { transform: tr(p1.x, p1.y, s) }, duration: dur, ease: 'power2.in' }, t0)
          .to(c, { opacity: 0, duration: 0.25 }, t0 + dur - 0.2);
        tl.to(n, { opacity: 0.45, duration: 0.5 }, t0);
      });
      const fin = at + (items.length - 1) * 0.06 + dur - 0.1;
      tl.fromTo(dest, { opacity: 0, attr: { transform: tr(p1.x, p1.y, 1.35) } }, { opacity: 1, attr: { transform: tr(p1.x, p1.y, 1) }, duration: 0.5, ease: 'back.out(2)', immediateRender: false }, fin);
      return fin + 0.5;
    }

    // ---------------------------------------------------------------- línea de tiempo
    const tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut' } });
    tl.addLabel('s0', 0);
    let at = 0;

    // s1: las barras del objetivo se superponen a las de la predicción; la diferencia de cada número; D por piezas
    head.a(tl, 1, at);
    barP.forEach((b, c) => tl.to(b, { attr: { width: Math.max(1.5, 2 * BL * P[0][c]) }, duration: 1.2 }, at + 0.4));
    barT.forEach((b, c) => tl.to(b, { attr: { x: X1, width: Math.max(1.5, 2 * BL * T[0][c]) }, duration: 1.2 }, at + 0.4 + 0.03 * c));
    dif.forEach((d, c) => tl.to(d, { opacity: 1, duration: 0.35 }, at + 1.7 + 0.06 * c));
    F1.a(tl, 1, at + 1.9, 0.7); F1.a(tl, 2, at + 2.3, 0.7); F1.a(tl, 3, at + 2.8, 0.6);
    tl.fromTo(v1, { opacity: 0, attr: { transform: tr(v1.pos.x, YR + 12) } }, { opacity: 1, attr: { transform: tr(v1.pos.x, YR) }, duration: 0.5, immediateRender: false }, at + 3.2)
      .to(nota1, { opacity: 1, duration: 0.5, stagger: 0.2 }, at + 3.5);
    at = tl.duration(); tl.addLabel('s1', at);

    // nivel k (2, 3, 4): aparece la columna, el valor del nivel anterior viaja a su lugar y aparecen los demás
    function aporta(k, de, items) {
      tl.to(cols[k - 1], { opacity: 0.5, duration: 0.6 }, at + 0.3)
        .to(cols[k], { opacity: 1, duration: 0.6 }, at + 0.3);
      A.trazar(tl, flechas[k - 1], at + 0.4, 0.6);
      tl.set(flechas[k - 1], { attr: { 'marker-end': flechas[k - 1]._punta } }, at + 0.9);
      viaja(tl, de, items[0].n, at + 0.8, 1.4);
      items.slice(1).forEach((it, i) => tl.fromTo(it.g, { opacity: 0 }, { opacity: 1, duration: 0.45, immediateRender: false }, at + 2.4 + 0.12 * i));
    }

    // s2: la distancia del parche viaja al bloque; aparecen los otros 5 parches
    head.a(tl, 2, at); aporta(1, v1, items2);
    at = tl.duration(); tl.addLabel('s2', at);
    // s3: promedio del bloque
    head.a(tl, 3, at);
    tl.to(cap2, { opacity: 1, duration: 0.5 }, at + 0.3).to(res2.eq, { opacity: 1, duration: 0.5 }, at + 0.5);
    absorbe(tl, items2.map(i => i.n), res2.n, at + 0.7);
    at = tl.duration(); tl.addLabel('s3', at);

    // s4: el promedio del bloque viaja a la imagen; aparecen los otros 3 bloques
    head.a(tl, 4, at); aporta(2, res2.n, items3);
    at = tl.duration(); tl.addLabel('s4', at);
    // s5: promedio de la imagen
    head.a(tl, 5, at);
    tl.to(cap3, { opacity: 1, duration: 0.5 }, at + 0.3).to(res3.eq, { opacity: 1, duration: 0.5 }, at + 0.5);
    absorbe(tl, items3.map(i => i.n), res3.n, at + 0.7);
    at = tl.duration(); tl.addLabel('s5', at);

    // s6: el valor de la imagen viaja al lote; aparecen las otras imágenes
    head.a(tl, 6, at); aporta(3, res3.n, items4);
    at = tl.duration(); tl.addLabel('s6', at);
    // s7: promedio del lote: la pérdida L
    head.a(tl, 7, at);
    tl.to(cap4, { opacity: 1, duration: 0.5 }, at + 0.3)
      .to([caja4, txtL], { opacity: 1, duration: 0.6 }, at + 0.5);
    absorbe(tl, items4.map(i => i.n), vL, at + 0.9, 1.4);
    at = tl.duration(); tl.addLabel('s7', at);

    // s8: el gradiente llega al predictor y al encoder de contexto; s_y no recibe gradiente
    head.a(tl, 8, at); notas.a(tl, 1, at);
    tl.to([...cols.slice(0, 3), ...flechas], { opacity: 0, duration: 0.6 }, at + 0.3)
      .to(items4.map(i => i.g), { opacity: 0.35, duration: 0.6 }, at + 0.3)
      .to(cap4, { opacity: 0.4, duration: 0.6 }, at + 0.3)
      .to(gGr, { opacity: 1, duration: 0.01 }, at + 0.8)
      .to(cajas, { opacity: 1, duration: 0.5, stagger: 0.12 }, at + 0.8);
    ida.forEach((f, i) => trazaP(tl, f, at + 1.3 + 0.1 * i, 0.6));
    trazaP(tl, grad[0], at + 2.2, 0.9); tl.to(nab[0], { opacity: 1, duration: 0.4 }, at + 2.6);
    trazaP(tl, grad[1], at + 3.1, 0.6); tl.to(nab[1], { opacity: 1, duration: 0.4 }, at + 3.3);
    tl.fromTo(cruz, { opacity: 0 }, { opacity: 1, duration: 0.5, immediateRender: false }, at + 3.8);
    at = tl.duration(); tl.addLabel('s8', at);

    A.pasos(root, tl);
  }

  // ============================================================ Paso 7: la actualización por EMA
  K.register('ema', root => {
    const S = A.svg(root, 1280, 500);
    A.cuandoFuentes(() => ema(root, S));
  });

  function ema(root, S) {
    // ---------------------------------------------------------------- trayectorias (las de la versión en canvas)
    const T = 1500, rnd = K.mulberry(7), th = [[0.75, 0.35]];
    const optimo = k => [0.62 * Math.cos(k / 260), 0.62 * Math.sin(k / 190)];
    for (let k = 1; k < T; k++) { const p = th[k - 1], o = optimo(k); th.push([0, 1].map(d => p[d] + 0.025 * (o[d] - p[d]) + 0.032 * K.gauss(rnd))); }
    const prom = mk => { const out = [th[0].slice()]; for (let k = 1; k < T; k++) { const m = mk(k); out.push([0, 1].map(d => m * out[k - 1][d] + (1 - m) * th[k][d])); } return out; };
    const E90 = prom(() => 0.9), E996 = prom(() => 0.996), ESCH = prom(k => 0.996 + 0.004 * k / T);

    // ---------------------------------------------------------------- geometría
    const P = { x: 24, y: 64, s: 292 }, Q = { x: 420, y: 92, w: 836, h: 206 }, MS = { x: 1000, y: 372, w: 240, h: 64 };
    const PX = v => P.x + P.s / 2 + v * P.s * 0.42, PY = v => P.y + P.s / 2 - v * P.s * 0.42;
    const QLO = Math.min(...th.map(p => p[0])), QHI = Math.max(...th.map(p => p[0]));   // la coordenada entra entera en el gráfico
    const QX = k => Q.x + Q.w * k / (T - 1), QY = v => Q.y + 10 + (QHI - v) / (QHI - QLO) * (Q.h - 20);
    const f1 = v => Math.round(v * 10) / 10;

    const head = A.encabezado(S, 7, [
      'El encoder objetivo no recibe gradiente: sus pesos se actualizan con un promedio móvil',
      'Los pesos $\\theta$ del encoder de contexto se mueven por gradiente, con ruido',
      'Promedio móvil: en cada paso, $\\bar\\theta$ se acerca un poco a $\\theta$',
      'Con $m = 0{,}9$ el promedio sigue de cerca a $\\theta$',
      'Con $m = 0{,}996$ promedia unos 250 pasos: el objetivo cambia despacio',
      'En I-JEPA $m$ sube de 0,996 a 1: hacia el final el encoder objetivo casi no se mueve'
    ]);
    head.set(0);

    // panel 2D y gráfico de una coordenada
    el('rect', { x: P.x, y: P.y, width: P.s, height: P.s, rx: 10, fill: '#fafafc', stroke: C.grid, 'stroke-width': 1.2 }, S);
    A.texto(S, 'pesos de la red (esquema en 2D)', P.x + P.s / 2, P.y + P.s + 26, { size: 18, color: C.grey2, anchor: 'middle' });
    for (let g = 0; g <= 4; g++) el('line', { x1: Q.x, x2: Q.x + Q.w, y1: Q.y + Q.h * g / 4, y2: Q.y + Q.h * g / 4, stroke: C.grid, 'stroke-width': 1 }, S);
    A.texto(S, 'una coordenada de los pesos a lo largo del entrenamiento', Q.x, Q.y - 18, { size: 19, weight: '600', color: C.navy });
    A.texto(S, 'pasos →', Q.x + Q.w, Q.y + Q.h + 24, { size: 17, color: C.grey2, anchor: 'end' });

    // una trayectoria: trazo en el plano (se dibuja por índice, con fotogramas de stroke-dashoffset), trazo en el tiempo
    // (recortado por un rectángulo que crece) y un punto en la punta de cada uno
    const PASO = 25, IDX = [...Array(Math.floor((T - 1) / PASO) + 1)].map((_, i) => i * PASO).concat((T - 1) % PASO ? [T - 1] : []);
    function capa(pts, col, lw) {
      const g = el('g', {}, S);
      const dP = 'M' + pts.map(p => f1(PX(p[0])) + ',' + f1(PY(p[1]))).join('L');
      const plano = el('path', { d: dP, fill: 'none', stroke: col, 'stroke-width': lw, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
        pathLength: 1, 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1 }, g);
      const id = S.uid('rec'), cp = el('clipPath', { id }, S.defs);
      const rec = el('rect', { x: Q.x - 4, y: Q.y - 60, width: 0, height: Q.h + 120 }, cp);
      el('path', { d: 'M' + pts.map((p, k) => f1(QX(k)) + ',' + f1(QY(p[0]))).join('L'), fill: 'none', stroke: col, 'stroke-width': lw,
        'stroke-linejoin': 'round', 'clip-path': 'url(#' + id + ')' }, g);
      const dot = el('circle', { cx: 0, cy: 0, r: lw + 3, fill: col, transform: tr(PX(pts[0][0]), PY(pts[0][1])) }, g);
      const dot2 = el('circle', { cx: 0, cy: 0, r: lw + 2, fill: col, transform: tr(QX(0), QY(pts[0][0])) }, g);
      [dot, dot2].forEach(d => { d.style.opacity = 0; });
      // longitud acumulada en el plano para que el trazo avance por índice, igual que el punto
      const L = [0]; for (let k = 1; k < T; k++) L.push(L[k - 1] + Math.hypot(PX(pts[k][0]) - PX(pts[k - 1][0]), PY(pts[k][1]) - PY(pts[k - 1][1])));
      const Lt = L[T - 1];
      g.dibuja = (tl, at, dur) => {
        const kf = f => IDX.slice(1).map((k, i) => ({ ...f(k), duration: dur * (k - IDX[i]) / (T - 1), ease: 'none' }));
        tl.to([dot, dot2], { opacity: 1, duration: 0.2 }, at)
          .to(plano, { keyframes: kf(k => ({ attr: { 'stroke-dashoffset': 1 - L[k] / Lt } })), ease: 'none' }, at)
          .to(dot, { keyframes: kf(k => ({ attr: { transform: tr(PX(pts[k][0]), PY(pts[k][1])) } })), ease: 'none' }, at)
          .to(dot2, { keyframes: kf(k => ({ attr: { transform: tr(QX(k), QY(pts[k][0])) } })), ease: 'none' }, at)
          .to(rec, { attr: { width: Q.w + 8 }, duration: dur, ease: 'none' }, at);
      };
      return g;
    }
    const cTh = capa(th, C.teal, 1.4), c90 = capa(E90, C.blue, 2.2), c996 = capa(E996, C.navy, 3), cSch = capa(ESCH, C.navy, 3.6);

    // leyenda
    const LEY = [['$\\theta$: encoder de contexto', C.teal, 1.4], ['$\\bar\\theta$ con $m = 0{,}9$', C.blue, 2.2],
      ['$\\bar\\theta$ con $m = 0{,}996$', C.navy, 3], ['$\\bar\\theta$ con $m$ de 0,996 a 1 (I-JEPA)', C.navy, 3.6]].map(([s, col, lw], i) => {
      const g = el('g', {}, S), y = 356 + i * 30;
      el('line', { x1: Q.x, x2: Q.x + 26, y1: y - 6, y2: y - 6, stroke: col, 'stroke-width': lw + 0.6, 'stroke-linecap': 'round' }, g);
      A.texto(g, s, Q.x + 38, y, { size: 18, weight: i === 3 ? '600' : '400', color: col });
      g.style.opacity = 0; return g;
    });

    // recuadro: m durante el entrenamiento
    const gM = el('g', {}, S); gM.style.opacity = 0;
    A.texto(gM, '$m$ durante el entrenamiento', MS.x + MS.w / 2, MS.y - 14, { size: 18, weight: '600', color: C.navy, anchor: 'middle' });
    el('rect', { x: MS.x, y: MS.y, width: MS.w, height: MS.h, fill: '#fafafc', stroke: C.grid, 'stroke-width': 1.2 }, gM);
    A.texto(gM, '1', MS.x - 8, MS.y + 12, { size: 17, color: C.grey2, anchor: 'end' });
    A.texto(gM, '0,996', MS.x - 8, MS.y + MS.h, { size: 17, color: C.grey2, anchor: 'end' });
    A.texto(gM, 'entrenamiento →', MS.x + MS.w, MS.y + MS.h + 24, { size: 17, color: C.grey2, anchor: 'end' });
    const lineaM = A.flecha(gM, [[MS.x, MS.y + MS.h], [MS.x + MS.w, MS.y]], C.navy, { lw: 2.8, punta: false });
    lineaM.setAttribute('stroke-dasharray', '1 1'); lineaM.setAttribute('stroke-dashoffset', 1);

    // fórmula por piezas, debajo del panel 2D, y cuánto vale m
    const FX = P.x + P.s / 2;
    const F = A.formula(S, limpiar({ tb: '$\\bar\\theta$', ar: '$\\leftarrow$', m: '$m$', tb2: '$\\bar\\theta$', pl: '$+$', om: '$(1-m)$', th: '$\\theta$' }),
      [[], ['tb', 'ar'], ['tb', 'ar', 'm', 'tb2'], ['tb', 'ar', 'm', 'tb2', 'pl', 'om', 'th']],
      { cx: FX, y: 436, size: 30, gap: { ar: 8, pl: 8, tb2: -2, m: 1 }, color: { tb: C.navy, tb2: C.navy, th: C.teal, m: C.text, om: C.text, ar: C.text, pl: C.text } });
    F.set(0);
    const valM = A.rotulos(S, ['', 'con $m = 0{,}9$: un 10 % hacia $\\theta$ por paso', 'con $m = 0{,}996$: un 0,4 % por paso', '$m$ sube de 0,996 a 1'],
      { x: FX, y: 478, size: 18, color: C.grey2, anchor: 'middle' });
    valM.set(0);

    // ---------------------------------------------------------------- línea de tiempo
    const tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut' } });
    tl.addLabel('s0', 0);
    let at = 0;

    // s1: θ se mueve por gradiente, con ruido
    head.a(tl, 1, at);
    tl.to(LEY[0], { opacity: 1, duration: 0.5 }, at + 0.3);
    cTh.dibuja(tl, at + 0.5, 2.4);
    at = tl.duration(); tl.addLabel('s1', at);

    // s2: la fórmula del promedio móvil, por piezas
    head.a(tl, 2, at);
    F.a(tl, 1, at + 0.4, 0.8); F.a(tl, 2, at + 1.2, 0.8); F.a(tl, 3, at + 2.0, 0.8);
    at = tl.duration(); tl.addLabel('s2', at);

    // s3: m = 0,9
    head.a(tl, 3, at); valM.a(tl, 1, at + 0.2);
    tl.to(cTh, { opacity: 0.45, duration: 0.6 }, at + 0.3).to(LEY[1], { opacity: 1, duration: 0.5 }, at + 0.4);
    c90.dibuja(tl, at + 0.7, 2.4);
    at = tl.duration(); tl.addLabel('s3', at);

    // s4: m = 0,996
    head.a(tl, 4, at); valM.a(tl, 2, at + 0.2);
    tl.to(c90, { opacity: 0.25, duration: 0.6 }, at + 0.3).to(LEY[1], { opacity: 0.45, duration: 0.6 }, at + 0.3)
      .to(LEY[2], { opacity: 1, duration: 0.5 }, at + 0.4);
    c996.dibuja(tl, at + 0.7, 2.4);
    at = tl.duration(); tl.addLabel('s4', at);

    // s5: m sube de 0,996 a 1 (I-JEPA)
    head.a(tl, 5, at); valM.a(tl, 3, at + 0.2);
    tl.to(c996, { opacity: 0.3, duration: 0.6 }, at + 0.3).to(LEY[2], { opacity: 0.5, duration: 0.6 }, at + 0.3)
      .to(LEY[3], { opacity: 1, duration: 0.5 }, at + 0.4).to(gM, { opacity: 1, duration: 0.5 }, at + 0.4);
    cSch.dibuja(tl, at + 0.8, 2.6);
    tl.to(lineaM, { attr: { 'stroke-dashoffset': 0 }, duration: 2.6, ease: 'none' }, at + 0.8);
    at = tl.duration(); tl.addLabel('s5', at);

    A.pasos(root, tl);
  }
})();
</script>
