<script>
/* dinamica: cómo se ve el entrenamiento de I-JEPA con datos reales (corridas propias del experimento,
   experimentos/ijepa-sphere/runs/grid_c1_seed{0,1,2} y grid_c2_seed0: metrics.csv → loss_pred por época,
   collapse.csv → erank_pooled cada 5 épocas). C1: media de 3 semillas; C2: 1 semilla. */
(function () {
  const K = window.OTK, A = window.OTA, C = A.C, el = A.el;
  const D = {"c1l": [0.1816, 0.0754, 0.0661, 0.0728, 0.0883, 0.1058, 0.1226, 0.1402, 0.157, 0.1729, 0.1863, 0.1979, 0.2066, 0.2141, 0.2218, 0.2277, 0.2319, 0.2362, 0.2395, 0.2439, 0.2453, 0.2484, 0.251, 0.2522, 0.2544, 0.256, 0.2575, 0.2578, 0.259, 0.2607, 0.2609, 0.2613, 0.2616, 0.2611, 0.2616, 0.2627, 0.2626, 0.262, 0.2624, 0.2625, 0.2621, 0.2618, 0.262, 0.2622, 0.2615, 0.2612, 0.2604, 0.2607, 0.2597, 0.2603, 0.2594, 0.2589, 0.2575, 0.2576, 0.2567, 0.2559, 0.2546, 0.2544, 0.2531, 0.2516, 0.2509, 0.25, 0.2502, 0.2484, 0.2474, 0.2461, 0.2449, 0.2437, 0.2433, 0.243, 0.241, 0.2397, 0.239, 0.2387, 0.237, 0.2354, 0.2353, 0.2337, 0.2329, 0.2316, 0.2304, 0.2298, 0.2286, 0.2277, 0.2265, 0.2253, 0.2239, 0.2232, 0.2227, 0.2229, 0.2214, 0.2205, 0.2197, 0.219, 0.2192, 0.219, 0.2179, 0.2183, 0.2181, 0.2173], "c2l": [0.1909, 0.0887, 0.0435, 0.0461, 0.0553, 0.0661, 0.0915, 0.101, 0.1167, 0.1282, 0.1419, 0.1619, 0.1543, 0.1562, 0.1677, 0.1606, 0.1597, 0.1564, 0.1804, 0.1689, 0.1725, 0.1824, 0.1756, 0.1726, 0.1841, 0.1802, 0.1807, 0.1598, 0.172, 0.1874, 0.1798, 0.1814, 0.1826, 0.2054, 0.2252, 0.2131, 0.2137, 0.221, 0.2136, 0.2164, 0.2013, 0.1694, 0.1826, 0.1736, 0.1683, 0.178, 0.1831, 0.1797, 0.207, 0.2098, 0.2224, 0.22, 0.2124, 0.2099, 0.1946, 0.1785, 0.1775, 0.1681, 0.1611, 0.1962, 0.21, 0.1925, 0.1902, 0.1917, 0.1813, 0.1841, 0.1942, 0.1882, 0.1737, 0.1661, 0.1678, 0.1722, 0.1699, 0.1642, 0.1551, 0.1525, 0.1562, 0.1526, 0.147, 0.1392, 0.141, 0.1482, 0.1396, 0.1398, 0.129, 0.1283, 0.1281, 0.1294, 0.1422, 0.1536, 0.1492, 0.1415, 0.1283, 0.1306, 0.1334, 0.1347, 0.1339, 0.1352, 0.1365, 0.1386], "c1r": [22.9, 48.7, 62.4, 70.8, 77.2, 82.8, 87.5, 91.6, 95.1, 98.1, 100.5, 102.2, 103.3, 104.0, 104.1, 103.8, 103.1, 102.3, 101.8, 101.6], "c2r": [9.0, 17.2, 22.5, 26.7, 29.2, 27.5, 24.8, 26.7, 29.7, 30.5, 27.4, 26.8, 28.6, 28.1, 27.9, 27.5, 27.3, 28.5, 27.7, 27.7]};
  const f = v => Math.round(v * 10) / 10;

  K.register('dinamica', root => {
    const W = 1100, H = 470, S = A.svg(root, W, H);
    A.cuandoFuentes(() => dibujar(root, S, W, H));
  });

  function dibujar(root, S, W, H) {
    const PL = { x: 74, y: 96, w: 430, h: 220, max: 0.3 }, PR = { x: 630, y: 96, w: 430, h: 220, max: 120 };
    const xL = ep => PL.x + PL.w * (ep - 1) / 99, yL = v => PL.y + PL.h - PL.h * v / PL.max;
    const xR = ep => PR.x + PR.w * ep / 100, yR = v => PR.y + PR.h - PR.h * v / PR.max;
    const C1 = C.blue, C2 = C.grey2;

    const head = A.rotulos(S, [
      'Una sola pérdida: el predictor persigue al encoder objetivo',
      'Primeras épocas: la pérdida cae, pero casi todo da igual',
      'La pérdida sube mientras la representación se enriquece',
      'Después baja despacio: objetivo y predicción se estabilizan',
      'Sin EMA: menos pérdida y peor representación'
    ], { x: 20, y: 34, size: 21, weight: '600', color: C.navy });
    head.set(0);

    // ejes
    function ejes(P, tit, sub, ticks, fmtT, xs, eps) {
      A.texto(S, tit, P.x, P.y - 30, { size: 18, weight: '600', color: C.navy });
      A.texto(S, sub, P.x, P.y - 10, { size: 15, color: C.grey2 });
      ticks.forEach(v => {
        const y = P.y + P.h - P.h * v / P.max;
        el('line', { x1: P.x, x2: P.x + P.w, y1: f(y), y2: f(y), stroke: C.grid, 'stroke-width': 1 }, S);
        A.texto(S, fmtT(v), P.x - 8, y + 5, { size: 15, color: C.grey2, anchor: 'end' });
      });
      eps.forEach(e => A.texto(S, String(e), xs(e), P.y + P.h + 22, { size: 15, color: C.grey2, anchor: 'middle' }));
      A.texto(S, 'época', P.x + P.w, P.y + P.h + 42, { size: 15, color: C.grey2, anchor: 'end' });
    }
    ejes(PL, 'Pérdida de predicción', 'lo que se minimiza', [0, 0.1, 0.2, 0.3], v => v.toFixed(1).replace('.', ','), xL, [1, 20, 40, 60, 80, 100]);
    ejes(PR, 'Rango efectivo', 'dimensiones usadas, de 192', [0, 40, 80, 120], v => String(v), xR, [0, 20, 40, 60, 80, 100]);

    // curvas reveladas con un recorte que crece
    function curva(P, pts, col, dash, w) {
      const id = S.uid('clip'), rect = el('rect', { x: P.x - 6, y: P.y - 40, width: 0, height: P.h + 60 }, el('clipPath', { id }, S.defs));
      const g = el('g', { 'clip-path': `url(#${id})` }, S);
      el('path', { d: 'M' + pts.map(p => f(p[0]) + ',' + f(p[1])).join(' L'), fill: 'none', stroke: col, 'stroke-width': w, 'stroke-dasharray': dash || null, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
      return rect;
    }
    const lossPts = a => a.map((v, k) => [xL(k + 1), yL(v)]), rankPts = a => a.map((v, k) => [xR(5 * (k + 1)), yR(v)]);
    const k2l = curva(PL, lossPts(D.c2l), C2, '7 5', 2.4), k2r = curva(PR, rankPts(D.c2r), C2, '7 5', 2.4);
    const k1l = curva(PL, lossPts(D.c1l), C1, null, 3.4), k1r = curva(PR, rankPts(D.c1r), C1, null, 3.4);
    const ancho = (P, x) => Math.max(0, x - P.x + 6);

    // marcas
    const marca = (x, y, col, txt, dx, dy, anchor) => {
      const g = el('g', {}, S); g.style.opacity = 0;
      el('circle', { cx: f(x), cy: f(y), r: 5.5, fill: col }, g);
      A.texto(g, txt, x + dx, y + dy, { size: 15, weight: '600', color: col, anchor: anchor || 'start' });
      return g;
    };
    const mMin = marca(xL(3), yL(D.c1l[2]), C1, 'mínimo: 0,07 (época 3)', 10, 20);
    const mR5 = marca(xR(5), yR(D.c1r[0]), C1, 'rango 23', 10, 6);
    const mPico = marca(xL(36), yL(D.c1l[35]), C1, '0,26', 0, -12, 'middle');
    const mFinL = marca(xL(100), yL(D.c1l[99]), C1, '0,22', -10, -12, 'end');
    const mFinR = marca(xR(100), yR(D.c1r[19]), C1, '102', -10, -12, 'end');
    const m2L = marca(xL(100), yL(D.c2l[99]), C2, '0,14', -10, 22, 'end');
    const m2R = marca(xR(100), yR(D.c2r[19]), C2, '28', -10, -12, 'end');

    // leyenda
    const ley = (x, col, dash, txt) => { const g = el('g', {}, S); el('line', { x1: x, x2: x + 30, y1: 386, y2: 386, stroke: col, 'stroke-width': 3, 'stroke-dasharray': dash || null }, g); A.texto(g, txt, x + 38, 391, { size: 16, color: C.navy }); return g; };
    ley(PL.x, C1, null, 'C1 · con EMA (I-JEPA)');
    const l2 = ley(PL.x + 260, C2, '7 5', 'C2 · sin EMA'); l2.style.opacity = 0;

    const nota = A.rotulos(S, [
      'El encoder de contexto y el predictor minimizan la pérdida; el encoder objetivo no: lo mueve el EMA.',
      'Predecir es fácil porque los objetivos todavía son pobres: casi todas las imágenes dan lo mismo.',
      'El encoder objetivo aprende y sus objetivos son cada vez más ricos y difíciles de predecir: el blanco se mueve.',
      'Termina en 0,22, por encima de su mínimo, con el rango cerca de 102.',
      'Sin EMA la pérdida queda más baja (0,14) pero el rango se estanca en 28; lineal 19,4 contra 43,4.'
    ], { x: 20, y: 426, size: 17, color: C.navy });
    nota.set(0);
    A.texto(S, 'Corridas propias: ViT-Tiny/16 en ImageNet-100, 100 épocas. C1: media de 3 semillas; C2: 1 semilla.', 20, 458, { size: 14, color: C.grey2 });

    // ---------------------------------------------------------------- línea de tiempo
    const tl = gsap.timeline({ paused: true, defaults: { ease: 'power1.inOut' } });
    tl.addLabel('s0', 0);
    let at = 0;
    const paso = (i, dur, fn) => { head.a(tl, i, at); nota.a(tl, i, at + 0.2); fn(at + 0.5); at = tl.duration(); tl.addLabel('s' + i, at); };
    paso(1, 1.6, t => {
      tl.to(k1l, { attr: { width: ancho(PL, xL(3)) }, duration: 1.2 }, t);
      tl.to(k1r, { attr: { width: ancho(PR, xR(5)) }, duration: 0.8 }, t);
      tl.to([mMin, mR5], { opacity: 1, duration: 0.5 }, t + 1.0);
    });
    paso(2, 2.4, t => {
      tl.to(mMin, { opacity: 0.45, duration: 0.4 }, t);
      tl.to(k1l, { attr: { width: ancho(PL, xL(36)) }, duration: 2.0 }, t);
      tl.to(k1r, { attr: { width: ancho(PR, xR(35)) }, duration: 2.0 }, t);
      tl.to(mPico, { opacity: 1, duration: 0.5 }, t + 1.8);
    });
    paso(3, 2.4, t => {
      tl.to(k1l, { attr: { width: ancho(PL, xL(100)) }, duration: 2.0 }, t);
      tl.to(k1r, { attr: { width: ancho(PR, xR(100)) }, duration: 2.0 }, t);
      tl.to([mFinL, mFinR], { opacity: 1, duration: 0.5 }, t + 1.8);
    });
    paso(4, 2.6, t => {
      tl.to(l2, { opacity: 1, duration: 0.5 }, t);
      tl.to(k2l, { attr: { width: ancho(PL, xL(100)) }, duration: 2.2 }, t + 0.2);
      tl.to(k2r, { attr: { width: ancho(PR, xR(100)) }, duration: 2.2 }, t + 0.2);
      tl.to([m2L, m2R], { opacity: 1, duration: 0.5 }, t + 2.2);
    });
    A.pasos(root, tl);
  }
})();
</script>
