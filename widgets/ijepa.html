<script>
/* Widgets de I-JEPA. Todos los números que aparecen salen de Assran et al. (2023):
   tablas 1 a 6 y apéndices A y C. Requiere widgets/nucleo.html. */
(function () {
  const K = window.OTK;
  const { C, setupCanvas, text, parrafo, dot, caja, flecha, sobre, ease, clamp, alfa, mulberry, gauss } = K;
  const num = (v, d = 1) => v.toFixed(d).replace('.', ',');

  // texto con subíndice, centrado en x
  function sub(ctx, base, s, x, y, opt = {}) {
    const size = opt.size || 18;
    ctx.font = (opt.weight || '600') + ' ' + size + 'px ' + K.FONT; const wb = ctx.measureText(base).width;
    ctx.font = (opt.weight || '600') + ' ' + size * 0.68 + 'px ' + K.FONT; const ws = ctx.measureText(s).width;
    const x0 = opt.align === 'left' ? x : x - (wb + ws) / 2;
    text(ctx, base, x0, y, { ...opt, size, weight: opt.weight || '600', align: 'left' });
    text(ctx, s, x0 + wb + 1, y + size * 0.22, { ...opt, size: size * 0.68, weight: opt.weight || '600', align: 'left' });
    return wb + ws;
  }

  // ------------------------------------------------------------ escena dibujada (sin fotos externas)
  let _escena = null;
  function escena() {
    if (_escena) return _escena;
    const S = 448, cv = document.createElement('canvas'); cv.width = cv.height = S;
    const g = cv.getContext('2d');
    let gr = g.createLinearGradient(0, 0, 0, S * 0.62); gr.addColorStop(0, '#9fc9e8'); gr.addColorStop(1, '#e8f1f5');
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
    g.fillStyle = '#ffd98a'; g.beginPath(); g.arc(352, 86, 38, 0, 7); g.fill();
    g.fillStyle = '#ffffff';
    for (const [x, y, r] of [[80, 70, 22], [106, 62, 28], [136, 72, 20], [236, 118, 14], [254, 112, 18], [274, 120, 13]]) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
    g.fillStyle = '#7fa6b8'; g.beginPath(); g.moveTo(0, 270); g.lineTo(90, 150); g.lineTo(170, 240); g.lineTo(250, 130); g.lineTo(360, 250); g.lineTo(448, 190); g.lineTo(448, 300); g.lineTo(0, 300); g.fill();
    g.fillStyle = '#f4f7f9'; g.beginPath(); g.moveTo(250, 130); g.lineTo(226, 162); g.lineTo(244, 156); g.lineTo(256, 168); g.lineTo(276, 160); g.fill();
    g.fillStyle = '#5fae8c'; g.beginPath(); g.moveTo(0, 300); g.quadraticCurveTo(120, 232, 260, 286); g.quadraticCurveTo(360, 318, 448, 268); g.lineTo(448, 448); g.lineTo(0, 448); g.fill();
    g.fillStyle = '#4c9a79'; g.beginPath(); g.moveTo(0, 360); g.quadraticCurveTo(200, 316, 448, 372); g.lineTo(448, 448); g.lineTo(0, 448); g.fill();
    g.fillStyle = '#6fb3d6'; g.beginPath(); g.ellipse(330, 372, 96, 26, 0, 0, 7); g.fill();
    // casa
    g.fillStyle = '#f6efe4'; g.fillRect(76, 262, 96, 70);
    g.fillStyle = '#ce5553'; g.beginPath(); g.moveTo(64, 266); g.lineTo(124, 218); g.lineTo(184, 266); g.fill();
    g.fillStyle = '#16213e'; g.fillRect(112, 292, 24, 40);
    g.fillStyle = '#9fc9e8'; g.fillRect(84, 278, 20, 20); g.fillRect(144, 278, 20, 20);
    // árbol
    g.fillStyle = '#7a5a43'; g.fillRect(256, 250, 14, 70);
    g.fillStyle = '#2a9d8f'; for (const [x, y, r] of [[263, 222, 40], [236, 246, 28], [292, 244, 30]]) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
    // pájaros
    g.strokeStyle = '#16213e'; g.lineWidth = 3; g.lineCap = 'round';
    for (const [x, y] of [[180, 96], [212, 78]]) { g.beginPath(); g.moveTo(x - 12, y - 6); g.quadraticCurveTo(x - 4, y - 10, x, y); g.quadraticCurveTo(x + 4, y - 10, x + 12, y - 6); g.stroke(); }
    return (_escena = cv);
  }
  K.escena = escena;

  // ============================================================ 1. enmascarado multi-bloque
  K.register('mascaras', root => {
    const cv = root.querySelector('canvas'), { ctx, W, H } = setupCanvas(cv);
    const N = 14, IM = { x: 20, y: 19, s: 392 }, p = IM.s / N;
    // ablaciones del apéndice C (ViT-B/16, 300 épocas, evaluación lineal con 1 % de etiquetas)
    const TS = [[0.075, 0.2, 19.2], [0.1, 0.2, 39.2], [0.125, 0.2, 42.4], [0.15, 0.2, 54.2], [0.2, 0.25, 38.9], [0.2, 0.3, 33.6]];
    const CS = [[0.40, 1.0, 31.2], [0.65, 1.0, 47.1], [0.75, 1.0, 49.3], [0.85, 1.0, 54.2]];
    const NT = { 1: 9.0, 2: 22.0, 3: 48.5, 4: 54.2 };
    const EST = [['multi', 'multi-bloque', 54.2], ['bloque', 'un bloque', 20.2], ['azar', 'aleatorio', 17.6], ['raster', 'rasterizado', 15.5]];
    let est = root.dataset.estrategia || 'multi', iT = 3, iC = 3, nT = 4, auto = false, reloj = 0, entra = 1;
    let enCtx = new Uint8Array(N * N), enObj = new Uint8Array(N * N), bloques = [], cajaCtx = null;
    const rnd = Math.random;
    // como en src/masks/multiblock.py: el tamaño (escala y aspecto, con un mismo número al azar) se sortea una vez
    // y lo comparten los bloques de ese tipo; la posición se sortea por bloque
    function tamano(lo, hi, arLo, arHi) {
      const r = rnd(), s = lo + (hi - lo) * r, ar = arLo + (arHi - arLo) * r, keep = Math.floor(N * N * s);
      return { h: Math.min(N - 1, Math.max(1, Math.round(Math.sqrt(keep * ar)))), w: Math.min(N - 1, Math.max(1, Math.round(Math.sqrt(keep / ar)))) };
    }
    const ubica = ({ h, w }) => ({ top: Math.floor(rnd() * (N - h)), left: Math.floor(rnd() * (N - w)), h, w });
    const bloque = (lo, hi, arLo, arHi) => ubica(tamano(lo, hi, arLo, arHi));
    const pinta = (m, b, v) => { for (let i = b.top; i < b.top + b.h; i++) for (let j = b.left; j < b.left + b.w; j++) m[i * N + j] = v; };
    function muestrea() {
      enCtx.fill(0); enObj.fill(0); bloques = []; cajaCtx = null; entra = 0;
      if (est === 'multi') {
        const tm = tamano(TS[iT][0], TS[iT][1], 0.75, 1.5);
        for (let k = 0; k < nT; k++) { const b = ubica(tm); bloques.push(b); pinta(enObj, b, k + 1); }
        cajaCtx = bloque(CS[iC][0], CS[iC][1], 1, 1); pinta(enCtx, cajaCtx, 1);
        for (let i = 0; i < N * N; i++) if (enObj[i]) enCtx[i] = 0;
      } else if (est === 'raster') {
        const q = Math.floor(rnd() * 4), h = N / 2; let k = 1;
        for (let a = 0; a < 4; a++) { const b = { top: (a >> 1) * h, left: (a & 1) * h, h, w: h };
          if (a === q) { pinta(enCtx, b, 1); cajaCtx = b; } else { bloques.push(b); pinta(enObj, b, k++); } }
      } else if (est === 'bloque') {
        const b = bloque(0.6, 0.6, 0.75, 1.5); bloques.push(b); pinta(enObj, b, 1);
        for (let i = 0; i < N * N; i++) enCtx[i] = enObj[i] ? 0 : 1;
      } else {
        const idx = [...Array(N * N).keys()].sort(() => rnd() - 0.5).slice(0, Math.round(0.6 * N * N));
        for (const i of idx) enObj[i] = 1;
        for (let i = 0; i < N * N; i++) enCtx[i] = enObj[i] ? 0 : 1;
      }
    }
    function reportado() {
      if (est !== 'multi') return EST.find(e => e[0] === est)[2];
      const d = (iT !== 3) + (iC !== 3) + (nT !== 4);
      if (d === 0) return 54.2; if (d > 1) return null;
      return iT !== 3 ? TS[iT][2] : iC !== 3 ? CS[iC][2] : NT[nT];
    }
    function mini(x, y, s, mask, color) {
      const q = s / N;
      ctx.drawImage(escena(), x, y, s, s);
      ctx.fillStyle = C.light;
      for (let i = 0; i < N * N; i++) if (!mask[i]) ctx.fillRect(x + (i % N) * q - 0.3, y + Math.floor(i / N) * q - 0.3, q + 0.6, q + 0.6);
      caja(ctx, x, y, s, s, { r: 4, stroke: color, lw: 2 });
    }
    function draw() {
      ctx.clearRect(0, 0, W, H);
      const a = ease(entra);
      ctx.drawImage(escena(), IM.x, IM.y, IM.s, IM.s);
      for (let i = 0; i < N * N; i++) {
        const x = IM.x + (i % N) * p, y = IM.y + Math.floor(i / N) * p;
        if (!enCtx[i] && !enObj[i]) { ctx.fillStyle = `rgba(140,145,160,${0.8 * a})`; ctx.fillRect(x, y, p, p); }
        if (enObj[i]) { ctx.fillStyle = alfa('#ffffff', 0.45 * a); ctx.fillRect(x, y, p, p); ctx.fillStyle = alfa(C.coral, 0.5 * a); ctx.fillRect(x, y, p, p); }
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let k = 1; k < N; k++) { ctx.moveTo(IM.x + k * p, IM.y); ctx.lineTo(IM.x + k * p, IM.y + IM.s); ctx.moveTo(IM.x, IM.y + k * p); ctx.lineTo(IM.x + IM.s, IM.y + k * p); }
      ctx.stroke();
      if (cajaCtx) caja(ctx, IM.x + cajaCtx.left * p, IM.y + cajaCtx.top * p, cajaCtx.w * p, cajaCtx.h * p, { r: 3, stroke: alfa(C.teal, a), lw: 3, dash: [8, 5] });
      bloques.forEach((b, k) => {
        const x = IM.x + b.left * p, y = IM.y + b.top * p;
        caja(ctx, x, y, b.w * p, b.h * p, { r: 3, stroke: alfa(C.coralD, a), lw: 3 });
        if (est !== 'bloque' || true) { caja(ctx, x + 4, y + 4, 22, 22, { r: 5, fill: alfa(C.coralD, a) }); text(ctx, String(k + 1), x + 15, y + 21, { color: '#fff', size: 15, weight: '600', align: 'center' }); }
      });
      caja(ctx, IM.x, IM.y, IM.s, IM.s, { r: 2, stroke: C.grid, lw: 1 });
      // derecha: lo que recibe cada red
      const nc = enCtx.reduce((s, v) => s + v, 0), no = enObj.reduce((s, v) => s + (v ? 1 : 0), 0), nn = N * N - nc - no;
      const X1 = 450, X2 = 772, TY = 40, MS = 140;
      mini(X1, TY, MS, enCtx, C.teal);
      text(ctx, 'Contexto', X1 + MS + 14, TY + 22, { color: C.teal, size: 19, weight: '600' });
      text(ctx, 'lo único que ve el', X1 + MS + 14, TY + 48, { color: C.grey2, size: 15 });
      text(ctx, 'encoder de contexto', X1 + MS + 14, TY + 68, { color: C.grey2, size: 15 });
      text(ctx, nc + ' de 196', X1 + MS + 14, TY + 104, { color: C.navy, size: 22, weight: '600' });
      text(ctx, 'parches (' + Math.round(100 * nc / 196) + ' %)', X1 + MS + 14, TY + 126, { color: C.grey2, size: 15 });
      mini(X2, TY, MS, enObj, C.coralD);
      text(ctx, 'Objetivos', X2 + MS + 14, TY + 22, { color: C.coralD, size: 19, weight: '600' });
      text(ctx, 'lo que se predice', X2 + MS + 14, TY + 48, { color: C.grey2, size: 15 });
      text(ctx, '(unión de bloques)', X2 + MS + 14, TY + 68, { color: C.grey2, size: 15 });
      text(ctx, no + ' de 196', X2 + MS + 14, TY + 104, { color: C.navy, size: 22, weight: '600' });
      text(ctx, 'parches', X2 + MS + 14, TY + 126, { color: C.grey2, size: 15 });
      // los que no son ni contexto ni objetivo
      caja(ctx, X1, TY + 156, 16, 16, { r: 3, fill: 'rgba(140,145,160,0.8)' });
      text(ctx, nn ? `Gris: ${nn} parches que no son contexto ni objetivo (sólo los ve el encoder objetivo)` : 'Acá el contexto es todo lo que no es objetivo', X1 + 24, TY + 169, { color: C.grey2, size: 14.5, weight: '600' });
      // ablación de estrategias (tabla 6 del paper)
      const BY = 240;
      text(ctx, 'Qué reporta el paper', X1, BY, { color: C.navy, size: 17, weight: '600' });
      text(ctx, 'top-1 lineal en ImageNet con 1 % de etiquetas · ViT-B/16, 300 épocas', X1, BY + 21, { color: C.grey2, size: 13.5 });
      EST.forEach((e, k) => {
        const y = BY + 44 + k * 34, on = e[0] === est, col = on ? (e[0] === 'multi' ? C.teal : C.coralD) : '#c9ccd6';
        text(ctx, e[1], X1, y + 17, { color: on ? C.navy : C.grey2, size: 15.5, weight: on ? '600' : '400' });
        caja(ctx, X1 + 118, y + 3, 250 * e[2] / 60, 20, { r: 4, fill: col });
        text(ctx, num(e[2]), X1 + 118 + 250 * e[2] / 60 + 8, y + 18, { color: on ? C.navy : C.grey2, size: 15.5, weight: on ? '600' : '400' });
      });
      const r = reportado(), RX = 965;
      caja(ctx, RX - 105, BY + 40, 210, 132, { r: 12, fill: C.light });
      text(ctx, 'esta configuración', RX, BY + 66, { color: C.grey2, size: 14.5, align: 'center' });
      if (r === null) {
        text(ctx, '—', RX, BY + 116, { color: C.grey, size: 44, weight: '600', align: 'center' });
        text(ctx, 'combinación no reportada', RX, BY + 152, { color: C.grey2, size: 13.5, align: 'center' });
      } else {
        text(ctx, num(r), RX, BY + 122, { color: r >= 54 ? C.teal : C.coralD, size: 46, weight: '700', align: 'center' });
        text(ctx, '% top-1 reportado', RX, BY + 152, { color: C.grey2, size: 13.5, align: 'center' });
      }
    }
    const b = K.bar(root);
    const play = K.iconButton(b, K.ICON_PLAY, 'Remuestrear solo cada pocos segundos', () => { auto = !auto; play.innerHTML = auto ? K.ICON_PAUSE : K.ICON_PLAY; });
    K.textButton(b, 'Remuestrear', () => { muestrea(); reloj = 0; });
    const cambia = () => { muestrea(); reloj = 0; sl.forEach(s => s.closest('label').classList.toggle('apagado', est !== 'multi')); };
    K.opciones(b, EST.map(e => [e[0], e[1]]), est, v => { est = v; cambia(); });
    const sl = [
      K.choice(b, 'escala objetivos', TS.map((_, i) => i), iT, i => '(' + String(TS[i][0]).replace('.', ',') + '; ' + String(TS[i][1]).replace('.', ',') + ')', v => { iT = v; cambia(); }),
      K.choice(b, 'escala contexto', CS.map((_, i) => i), iC, i => '(' + CS[i][0].toFixed(2).replace('.', ',') + '; 1)', v => { iC = v; cambia(); }),
      K.choice(b, 'objetivos', [1, 2, 3, 4], nT, v => String(v), v => { nT = v; cambia(); })];
    sl.forEach(s => s.closest('label').classList.toggle('apagado', est !== 'multi'));
    root._entrar = () => { muestrea(); reloj = 0; };
    K.frame(root, (now, dt) => {
      entra = Math.min(1, entra + dt / 450);
      if (auto) { reloj += dt; if (reloj > 2600) { muestrea(); reloj = 0; } }
      draw();
    });
    muestrea(); entra = 1; draw();
  });

  // ============================================================ 2. píxeles vs. representación
  K.register('pixlat', root => {
    const cv = root.querySelector('canvas'), { ctx, W, H } = setupCanvas(cv);
    const G = 48, KS = 240, P = [{ x: 30 }, { x: 400 }, { x: 770 }], PY = 62, PS = 300;
    let u = +(root.dataset.u || 0.7), media = new Float32Array(G * G), mse = 0, actual = null, reloj = 0, seed = 1;
    const r = mulberry(11);
    const tmp = document.createElement('canvas'); tmp.width = tmp.height = G; const tctx = tmp.getContext('2d'), img = tctx.createImageData(G, G);
    // un futuro posible: la pelota sale del mismo lugar con una dirección incierta; el fondo tiene textura impredecible
    function futuro() {
      const th = (r() * 2 - 1) * u * 1.15, d = 0.46, cx = 0.5 + d * Math.sin(th), cy = 0.82 - d * Math.cos(th);
      const I = new Float32Array(G * G);
      for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) {
        const x = (j + 0.5) / G, y = (i + 0.5) / G, dd = Math.hypot(x - cx, y - cy);
        const bola = clamp((0.105 - dd) / 0.03, 0, 1), fondo = clamp(0.82 + 0.28 * u * gauss(r), 0, 1);
        I[i * G + j] = (1 - bola) * fondo + bola * 0.08;
      }
      return { I, th };
    }
    function recalcula() {
      media.fill(0); const todos = [];
      for (let k = 0; k < KS; k++) { const f = futuro(); todos.push(f.I); for (let i = 0; i < G * G; i++) media[i] += f.I[i] / KS; }
      mse = 0; for (const I of todos) for (let i = 0; i < G * G; i++) mse += (I[i] - media[i]) ** 2 / (KS * G * G);
      actual = futuro();
    }
    function pinta(I, x, y, s) {
      for (let i = 0; i < G * G; i++) {  // de claro (fondo) a azul marino (pelota)
        const v = I[i], k = clamp((v - 0.08) / 0.74, 0, 1.25);
        img.data[4 * i] = clamp(22 + (236 - 22) * k, 0, 255); img.data[4 * i + 1] = clamp(33 + (238 - 33) * k, 0, 255);
        img.data[4 * i + 2] = clamp(62 + (244 - 62) * k, 0, 255); img.data[4 * i + 3] = 255;
      }
      tctx.putImageData(img, 0, 0);
      ctx.imageSmoothingEnabled = false; ctx.drawImage(tmp, x, y, s, s); ctx.imageSmoothingEnabled = true;
      caja(ctx, x, y, s, s, { r: 2, stroke: C.grid, lw: 1.5 });
    }
    // panel derecho: la representación de este futuro (objetivo) y la predicción
    function tabla() {
      const x = P[2].x, cO = x + 238, cP = x + 306, y0 = PY + 22, dy = 44, nitido = u < 0.06;
      const ang = Math.round(actual.th * 180 / Math.PI) + '°';
      K.rich(ctx, '$s_y$', cO, y0, { color: C.teal, size: 17, align: 'right' });
      K.rich(ctx, '$\\hat s_y$', cP, y0, { color: C.blue, size: 17, align: 'right' });
      const F = [['hay una pelota', 'sí', 'sí', true], ['tamaño', '0,21', '0,21', true], ['distancia recorrida', '0,46', '0,46', true],
                 ['dirección', ang, nitido ? '0°' : '?', true], ['textura del fondo', '', '', false]];
      F.forEach(([n, o, pr, ok], k) => {
        const y = y0 + 36 + k * dy;
        ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, y - 26); ctx.lineTo(x + 310, y - 26); ctx.stroke();
        text(ctx, n, x, y, { color: ok ? C.navy : C.grey, size: 15, weight: ok ? '600' : '400' });
        if (ok) { text(ctx, o, cO, y, { color: C.teal, size: 15, weight: '600', align: 'right' }); text(ctx, pr, cP, y, { color: pr === '?' ? C.coralD : C.blue, size: 15, weight: '600', align: 'right' }); }
        else text(ctx, 'no se representa', cP, y, { color: C.grey, size: 13.5, align: 'right' });
      });
    }
    function draw() {
      ctx.clearRect(0, 0, W, H);
      text(ctx, 'Un futuro posible', P[0].x, 30, { color: C.navy, size: 18, weight: '600' });
      text(ctx, 'cambia cada segundo y medio', P[0].x, 51, { color: C.grey2, size: 14 });
      pinta(actual.I, P[0].x, PY, PS);
      // posición de partida y dirección sorteada
      const sx = P[0].x + 0.5 * PS, sy = PY + 0.82 * PS;
      ctx.strokeStyle = C.coralD; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx, sy, 0.105 * PS, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      flecha(ctx, [[sx, sy], [sx + 0.3 * PS * Math.sin(actual.th), sy - 0.3 * PS * Math.cos(actual.th)]], C.coralD, { lw: 2.5, dash: [5, 4] });
      text(ctx, 'Predicción en píxeles', P[1].x, 30, { color: C.coralD, size: 18, weight: '600' });
      text(ctx, 'la que minimiza el error cuadrático: el promedio', P[1].x, 51, { color: C.grey2, size: 14 });
      pinta(media, P[1].x, PY, PS);
      text(ctx, 'error medio por píxel: ' + num(mse, 3), P[1].x, PY + PS + 26, { color: C.coralD, size: 16, weight: '600' });
      text(ctx, u < 0.06 ? 'sin incertidumbre, el promedio es nítido' : 'no se parece a ningún futuro real', P[1].x, PY + PS + 48, { color: C.grey2, size: 14 });
      text(ctx, 'Predicción en representación', P[2].x, 30, { color: C.teal, size: 18, weight: '600' });
      K.rich(ctx, 'objetivo $s_y$ y predicción $\\hat s_y$', P[2].x, 51, { color: C.grey2, size: 14 });
      tabla();
      text(ctx, 'la textura, irrelevante, se descarta', P[2].x, PY + PS + 26, { color: C.teal, size: 15, weight: '600' });
      K.rich(ctx, u < 0.06 ? 'sin incertidumbre, también se predice' : 'la dirección importa y es incierta: falta $z$', P[2].x, PY + PS + 48, { color: u < 0.06 ? C.grey2 : C.coralD, size: 14, align: 'left' });
      text(ctx, 'punto de partida', P[0].x, PY + PS + 26, { color: C.coralD, size: 14 });
      text(ctx, 'y dirección de este futuro', P[0].x, PY + PS + 46, { color: C.coralD, size: 14 });
    }
    const b = K.bar(root);
    K.choice(b, 'incertidumbre del futuro', [0, 0.15, 0.3, 0.5, 0.7, 0.85, 1], u, v => Math.round(v * 100) + ' %', v => { u = v; recalcula(); draw(); });
    K.frame(root, (now, dt) => { reloj += dt; if (reloj > 1700) { reloj = 0; actual = futuro(); draw(); } });
    recalcula(); draw();
  });

  // ============================================================ 3. colapso, stop-gradient y EMA
  // Simulación real, en chico: encoder lineal W (2×4), predictor lineal P (2×2), encoder objetivo W̄.

      ctx.lineTo(X(3), Y(0)); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = C.blue; ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.beginPath();
      for (let i = 0; i <= 300; i++) { const y = -3 + 6 * i / 300; i ? ctx.lineTo(X(y), Y(E(y))) : ctx.moveTo(X(y), Y(E(y))); }
      ctx.stroke();
      ctx.strokeStyle = C.grey; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(L.x, Y(0)); ctx.lineTo(L.x + L.w, Y(0)); ctx.stroke();
      for (const d of DAT) dot(ctx, X(d), Y(E(d)), C.teal, 8);
      ctx.strokeStyle = C.coralD; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(X(PRU), Y(0)); ctx.lineTo(X(PRU), Y(E(PRU))); ctx.stroke(); ctx.setLineDash([]);
      dot(ctx, X(PRU), Y(E(PRU)), C.coralD, 8);
      text(ctx, 'par incompatible: energía ' + num(E(PRU), 2), X(PRU) + 18, Math.min(Y(E(PRU)) + 5, Y(0) - 12), { color: C.coralD, size: 15.5, weight: '600' });
      text(ctx, 'pares compatibles (datos)', X(DAT[0]), Y(0) + 26, { color: C.teal, size: 15, weight: '600', align: 'center' });
      text(ctx, 'posibles y para un x fijo', L.x + L.w, Y(0) + 26, { color: C.grey2, size: 14, align: 'right' });
    };
    K.pasos(root, [0, 1], draw, { ms: 3000 });
  });

  // ============================================================ el colapso, por pasos
  // Dos vistas de cada imagen pasan por el mismo encoder; la pérdida sólo mide D(s_x, s_y).
  // Estados: sin entrenar → solución buena → colapso total → colapso dimensional.
  K.register('colapsoPasos', root => {
    const cv = root.querySelector('canvas'), { ctx, W, H } = setupCanvas(cv);
    const COL = [C.coralD, C.teal, C.blue, '#c9a227'];
    const P = { x: 470, y: 92, w: 300, h: 250 };
    const RX = 800;                                        // columna de lecturas
    const ROWS = [118, 182, 246, 310];
    const kf = [
      { c: [[-0.2, 0.3], [0.5, -0.1], [-0.45, -0.35], [0.2, 0.55]], u: [[0.5, 0.25], [-0.3, 0.45], [0.4, -0.4], [-0.45, -0.3]] },
      { c: [[-0.6, 0.55], [0.6, 0.5], [-0.55, -0.55], [0.6, -0.5]], u: [[0.06, 0.03], [-0.04, 0.05], [0.05, -0.04], [-0.05, -0.03]] },
      { c: [[0, 0], [0, 0], [0, 0], [0, 0]], u: [[0, 0], [0, 0], [0, 0], [0, 0]] },
      { c: [[-0.72, -0.36], [-0.24, -0.12], [0.24, 0.12], [0.72, 0.36]], u: [[0.05, 0.025], [-0.05, -0.025], [0.05, 0.025], [-0.05, -0.025]] },
    ];
    const lerp = (a, b, s) => a + (b - a) * s;
    const estado = t => {
      const k = Math.min(2, Math.floor(t)), s = ease(clamp(t - k, 0, 1)), A = kf[k], B = kf[k + 1];
      return [0, 1, 2, 3].map(i => {
        const c = [0, 1].map(d => lerp(A.c[i][d], B.c[i][d], s)), u = [0, 1].map(d => lerp(A.u[i][d], B.u[i][d], s));
        return { sx: [c[0] + u[0], c[1] + u[1]], sy: [c[0] - u[0], c[1] - u[1]], c };
      });
    };
    const mx = v => P.x + P.w / 2 + v * P.w * 0.44, my = v => P.y + P.h / 2 - v * P.h * 0.44;
    function miniatura(x, y, i, corr) {
      const s = 38;
      caja(ctx, x, y, s, s, { r: 5, fill: alfa(COL[i], 0.16), stroke: alfa(COL[i], 0.6), lw: 1.3 });
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, s, s); ctx.clip();
      const cx = x + s / 2 + corr, cy = y + s / 2 + corr * 0.6;
      ctx.fillStyle = COL[i]; ctx.beginPath();
      if (i === 0) { ctx.moveTo(cx - 12, cy + 4); ctx.lineTo(cx, cy - 10); ctx.lineTo(cx + 12, cy + 4); ctx.fill(); ctx.fillRect(cx - 9, cy + 4, 18, 10); }
      else if (i === 1) { ctx.arc(cx, cy - 3, 10, 0, 7); ctx.fill(); ctx.fillRect(cx - 2, cy + 5, 4, 10); }
      else if (i === 2) { ctx.ellipse(cx, cy + 2, 15, 7, 0, 0, 7); ctx.fill(); }
      else { ctx.arc(cx, cy, 10, 0, 7); ctx.fill(); }
      ctx.restore();
    }
    const draw = t => {
      ctx.clearRect(0, 0, W, H);
      const n = Math.round(t), st = estado(t);
      const HEAD = ['Joint-embedding: dos vistas por el mismo encoder; la pérdida acerca $s_x$ a $s_y$',
        'Solución buena: cada par coincide y las imágenes quedan separadas',
        'Solución trivial: el encoder devuelve el mismo vector para todo',
        'Colapso dimensional: las imágenes se separan en una sola dirección'];
      K.rich(ctx, HEAD[n], 24, 34, { color: n === 1 ? C.teal : n === 0 ? C.navy : C.coralD, size: 19, weight: '600', align: 'left' });
      // entrada: dos vistas por imagen
      text(ctx, 'dos vistas por imagen', 40, 84, { color: C.grey2, size: 13 });
      ROWS.forEach((y, i) => { miniatura(40, y - 19, i, -4); miniatura(86, y - 19, i, 5); flecha(ctx, [[132, y], [176, y]], C.grey, { lw: 1.6, cabeza: 6 }); });
      caja(ctx, 182, 92, 120, 240, { r: 10, fill: '#ffffff', stroke: C.blue, lw: 2.2 });
      text(ctx, 'encoder', 242, 206, { color: C.blue, size: 16, weight: '600', align: 'center' });
      text(ctx, '(compartido)', 242, 228, { color: C.grey2, size: 13, align: 'center' });
      flecha(ctx, [[310, 212], [452, 212]], C.grey, { lw: 2, cabeza: 8 });
      K.rich(ctx, 'un punto por vista', 381, 200, { color: C.grey2, size: 13, align: 'center' });
      // espacio de representaciones
      caja(ctx, P.x, P.y, P.w, P.h, { r: 8, fill: '#fafafc', stroke: C.grid, lw: 1.2 });
      text(ctx, 'espacio de representaciones', P.x + P.w / 2, P.y - 10, { color: C.navy, size: 14.5, weight: '600', align: 'center' });
      if (n === 3 || (t > 2 && t < 3)) {
        const a = clamp(t - 2, 0, 1);
        ctx.strokeStyle = alfa(C.coralD, 0.35 * a); ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(mx(-0.95), my(-0.475)); ctx.lineTo(mx(0.95), my(0.475)); ctx.stroke(); ctx.setLineDash([]);
      }
      st.forEach((p, i) => {
        ctx.strokeStyle = alfa(C.grey2, 0.7); ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(mx(p.sx[0]), my(p.sx[1])); ctx.lineTo(mx(p.sy[0]), my(p.sy[1])); ctx.stroke(); ctx.setLineDash([]);
        dot(ctx, mx(p.sx[0]), my(p.sx[1]), COL[i], 7);
        ctx.fillStyle = '#ffffff'; ctx.strokeStyle = COL[i]; ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.arc(mx(p.sy[0]), my(p.sy[1]), 6.5, 0, 7); ctx.fill(); ctx.stroke();
      });
      const a2 = clamp(1 - Math.abs(t - 2) * 2.5, 0, 1);
      if (a2 > 0) text(ctx, 'los 8 puntos, encimados', mx(0), my(0) + 34, { color: alfa(C.coralD, a2), size: 14, weight: '600', align: 'center' });
      dot(ctx, P.x + 14, P.y + P.h + 22, C.grey2, 6); K.rich(ctx, '$s_x$', P.x + 26, P.y + P.h + 27, { color: C.grey2, size: 15, align: 'left' });
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = C.grey2; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(P.x + 80, P.y + P.h + 22, 5.5, 0, 7); ctx.fill(); ctx.stroke();
      K.rich(ctx, '$s_y$', P.x + 92, P.y + P.h + 27, { color: C.grey2, size: 15, align: 'left' });
      text(ctx, 'color = imagen', P.x + P.w, P.y + P.h + 27, { color: C.grey2, size: 13.5, align: 'right' });
      // lecturas
      const perd = st.reduce((a, p) => a + Math.hypot(p.sx[0] - p.sy[0], p.sx[1] - p.sy[1]), 0) / 4;
      let sep = Infinity; for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) sep = Math.min(sep, Math.hypot(st[i].c[0] - st[j].c[0], st[i].c[1] - st[j].c[1]));
      const fila = (y, et, val, col) => { text(ctx, et, RX, y, { color: C.grey2, size: 14 }); text(ctx, val, RX, y + 28, { color: col, size: 22, weight: '700' }); };
      fila(120, 'pérdida (distancia de cada par)', num(perd, 2), perd < 0.2 ? C.teal : C.coralD);
      fila(190, '¿distingue las imágenes?', n === 0 ? '—' : sep > 0.25 ? 'sí' : 'no', n === 0 ? C.grey2 : sep > 0.25 ? C.teal : C.coralD);
      fila(260, 'dimensiones que usa', ['—', '2 de 2', '0 de 2', '1 de 2'][n], [C.grey2, C.teal, C.coralD, C.coralD][n]);
      const NOTA = ['La pérdida sólo mira cada par por separado: nada en ella obliga a separar imágenes distintas.',
        'Pérdida casi cero y representación útil.',
        'Pérdida exactamente cero y representación inútil: la pérdida no distingue este caso del anterior.',
        'Pérdida casi cero, pero la representación ocupa un subespacio chico. Es más sutil y más común que el colapso total.'];
      parrafo(ctx, NOTA[n], RX, 340, 280, { color: C.navy, size: 14.5, lh: 20 });
      text(ctx, 'Para evitarlo hace falta algo más que la pérdida: negativos, un regularizador o una asimetría entre ramas.', 24, H - 12, { color: C.grey2, size: 13.5 });
    };
    K.pasos(root, [0, 1, 2, 3], draw, { ms: 2600, max: 2600 });
  });

  // ============================================================ por qué no colapsa (stop-gradient + EMA), por pasos
  // Esquema: cinco imágenes; punto = predicción, anillo = objetivo. Cada escenario se anima al avanzar.
  K.register('noColapsa', root => {
    const cv = root.querySelector('canvas'), { ctx, W, H } = setupCanvas(cv);
    const NI = 5, COL = [C.blue, C.teal, C.coralD, '#c9a227', '#7b5ea7'];
    const CEN = [...Array(NI)].map((_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / NI; return [0.66 * Math.cos(a), 0.66 * Math.sin(a)]; });
    const OFF = [[0.32, 0.1], [-0.2, 0.28], [0.25, -0.26], [-0.3, -0.12], [0.12, 0.33]];
    const DR = [[0.12, 0.1], [0.1, 0.14], [-0.04, 0.16], [-0.14, 0.06], [0.02, -0.12]];
    const LN = [0.89, 0.45];                       // dirección a la que se aplasta sin EMA
    const proy = p => { const d = p[0] * LN[0] + p[1] * LN[1]; return [d * LN[0], d * LN[1]]; };
    const lerp2 = (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
    const P = { x: 40, y: 66, s: 282 };
    const mx = v => P.x + P.s / 2 + v * P.s * 0.42, my = v => P.y + P.s / 2 - v * P.s * 0.42;
    function estado(n, u) {                        // escenario n (1..4) en avance u
      u = ease(clamp(u, 0, 1));
      return CEN.map((c, i) => {
        const p0 = [c[0] + OFF[i][0], c[1] + OFF[i][1]];
        if (n === 0) return { p: p0, o: c, tr: null };
        if (n === 1) { const k = 1 - 0.97 * u; return { p: lerp2(p0, c, u).map(v => v * k), o: c.map(v => v * k), tr: null }; }
        if (n === 2) return { p: lerp2(p0, c, u), o: c, tr: null };
        if (n === 3) { const o = [c[0] + DR[i][0] * u, c[1] + DR[i][1] * u]; return { p: lerp2(p0, o, u), o, tr: c }; }
        const o = lerp2(c, proy(c), u); return { p: lerp2(p0, o, Math.min(1, u * 1.3)), o, tr: null };
      });
    }
    const TIT = ['Dos salidas por imagen: la predicción y el objetivo',
      'Si el gradiente pasara por las dos ramas, ambas se juntan en un punto',
      'Con stop-gradient, la pérdida no puede mover el objetivo',
      'Con EMA, el objetivo sigue al encoder de contexto, despacio',
      'Sin EMA (m = 0), el objetivo cambia con cada paso y la nube se aplasta'];
    const NOTA = ['La pérdida sólo pide que cada predicción caiga sobre su objetivo.',
      'Mover las dos salidas hacia la misma constante es el camino más corto a pérdida cero: colapso.',
      'El objetivo queda fijo durante el paso; para bajar la pérdida, la única salida es predecir bien.',
      'Los objetivos se desplazan, pero siguen separados: vienen de un encoder que todavía distingue las imágenes.',
      'Sin el promedio lento, predicción y objetivo se mueven juntos y la representación pierde dimensiones.'];
    const draw = t => {
      ctx.clearRect(0, 0, W, H);
      const n = Math.round(t), k = Math.max(1, Math.ceil(t - 1e-6)), u = t - (k - 1);
      const st = t < 1e-6 ? estado(0, 0) : estado(k, u);
      text(ctx, TIT[n], 24, 34, { color: n === 1 || n === 4 ? C.coralD : n === 0 ? C.navy : C.teal, size: 19, weight: '600' });
      caja(ctx, P.x, P.y, P.s, P.s, { r: 8, fill: '#fafafc', stroke: C.grid, lw: 1.2 });
      text(ctx, 'espacio de representaciones', P.x + P.s / 2, P.y - 8, { color: C.grey2, size: 13, align: 'center' });
      if (k === 4 && t > 3) { ctx.strokeStyle = alfa(C.coralD, 0.35 * clamp(u, 0, 1)); ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(mx(-LN[0]), my(-LN[1])); ctx.lineTo(mx(LN[0]), my(LN[1])); ctx.stroke(); ctx.setLineDash([]); }
      st.forEach((e, i) => {
        if (e.tr) { ctx.strokeStyle = alfa(COL[i], 0.4); ctx.lineWidth = 2; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(mx(e.tr[0]), my(e.tr[1])); ctx.lineTo(mx(e.o[0]), my(e.o[1])); ctx.stroke(); ctx.setLineDash([]); }
        ctx.strokeStyle = alfa(C.grey2, 0.6); ctx.lineWidth = 1.2; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(mx(e.p[0]), my(e.p[1])); ctx.lineTo(mx(e.o[0]), my(e.o[1])); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#ffffff'; ctx.strokeStyle = COL[i]; ctx.lineWidth = 2.8; ctx.beginPath(); ctx.arc(mx(e.o[0]), my(e.o[1]), 8, 0, 7); ctx.fill(); ctx.stroke();
        dot(ctx, mx(e.p[0]), my(e.p[1]), COL[i], 6);
      });
      dot(ctx, P.x + 12, P.y + P.s + 22, C.grey2, 5.5); K.rich(ctx, 'predicción $\\hat s_y$', P.x + 24, P.y + P.s + 27, { color: C.grey2, size: 14, align: 'left' });
      ctx.fillStyle = '#fff'; ctx.strokeStyle = C.grey2; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(P.x + 172, P.y + P.s + 22, 6, 0, 7); ctx.fill(); ctx.stroke();
      K.rich(ctx, 'objetivo $s_y$', P.x + 184, P.y + P.s + 27, { color: C.grey2, size: 14, align: 'left' });
      // lecturas
      const perd = st.reduce((a, e) => a + Math.hypot(e.p[0] - e.o[0], e.p[1] - e.o[1]), 0) / NI;
      const mu = [0, 1].map(d => st.reduce((a, e) => a + e.o[d], 0) / NI);
      const cxx = st.reduce((a, e) => a + (e.o[0] - mu[0]) ** 2, 0) / NI, cyy = st.reduce((a, e) => a + (e.o[1] - mu[1]) ** 2, 0) / NI, cxy = st.reduce((a, e) => a + (e.o[0] - mu[0]) * (e.o[1] - mu[1]), 0) / NI;
      const tr = cxx + cyy, det = cxx * cyy - cxy * cxy, l2 = Math.max(0, tr / 2 - Math.sqrt(Math.max(0, tr * tr / 4 - det)));
      const RX = 420;
      const fila = (y, et, val, col) => { text(ctx, et, RX, y, { color: C.grey2, size: 14 }); text(ctx, val, RX, y + 28, { color: col, size: 22, weight: '700' }); };
      fila(96, 'pérdida (distancia predicción–objetivo)', num(perd, 2), perd < 0.12 ? C.teal : C.navy);
      fila(166, 'dispersión de los objetivos', num(Math.sqrt(tr), 2), tr < 0.05 ? C.coralD : C.teal);
      fila(236, 'ancho en la dirección más angosta', num(Math.sqrt(l2), 2), l2 < 0.01 ? C.coralD : C.teal);
      K.parrafo(ctx, NOTA[n], RX, 320, 620, { color: C.navy, size: 15.5, lh: 22 });
      text(ctx, 'Esquema. La solución trivial sigue existiendo: lo que la evita es la dinámica del entrenamiento, sin garantía.', 24, H - 12, { color: C.grey2, size: 13.5 });
    };
    K.pasos(root, [0, 1, 2, 3, 4], draw, { ms: 2600, max: 2600 });
  });

  // ============================================================ mapa vertical de I-JEPA
  // dibujarMapa: diagrama de 300 × 500 (unidades lógicas) en (ox, oy); act[elemento] = 0..1 lo prende.
  const MAPA = (() => {
    const XL = 72, XR = 228, S = 92, H0 = 500, TY = H0 - S - 34;
    const yE = TY - 56, yS = yE - 64, yP = yS - 62, yH = yP - 62, yD = yH - 58, XM = (XL + XR) / 2;
    const RA = [{ r: 0, c: 3, h: 2, w: 3 }, { r: 3, c: 0, h: 3, w: 2 }];   // mismas máscaras que widgets/pasos.html
    const CB = { r: 1, c: 0, h: 5, w: 5 };
    const dentro = (b, r, c) => r >= b.r && r < b.r + b.h && c >= b.c && c < b.c + b.w;
    const BASE = 0.38, al = v => BASE + (1 - BASE) * (v || 0);
    return { XL, XR, S, TY, yE, yS, yP, yH, yD, XM, dibujar };
    function dibujar(ctx, ox, oy, act, opt = {}) {
      const A = k => act[k] || 0;
      ctx.save(); ctx.translate(ox, oy);
      const grilla = !!opt.grilla;
      function miniatura(x, lado, v) {
        const q = S / 6, y = TY;
        ctx.save(); ctx.globalAlpha = al(v);
        ctx.drawImage(escena(), x, y, S, S);
        if (!grilla) {
          if (lado === 'ctx') {
            ctx.fillStyle = '#eceef3';
            for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++)
              if (!dentro(CB, r, c) || RA.some(b => dentro(b, r, c))) ctx.fillRect(x + c * q, y + r * q, q + 0.5, q + 0.5);
            ctx.setLineDash([4, 3]); ctx.strokeStyle = C.teal; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, CB.w * q - 2, CB.h * q - 2); ctx.setLineDash([]);
          } else {
            RA.forEach(b => { ctx.fillStyle = alfa(C.coral, 0.35); ctx.fillRect(x + b.c * q, y + b.r * q, b.w * q, b.h * q);
              ctx.strokeStyle = C.coralD; ctx.lineWidth = 2; ctx.strokeRect(x + b.c * q, y + b.r * q, b.w * q, b.h * q); });
          }
        } else {
          ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1;
          for (let k = 1; k < 6; k++) { ctx.beginPath(); ctx.moveTo(x + k * q, y); ctx.lineTo(x + k * q, y + S); ctx.moveTo(x, y + k * q); ctx.lineTo(x + S, y + k * q); ctx.stroke(); }
        }
        ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.strokeRect(x, y, S, S);
        ctx.restore();
        if (v > 0.02) caja(ctx, x - 4, y - 4, S + 8, S + 8, { r: 6, stroke: alfa(lado === 'ctx' ? C.teal : C.coralD, v), lw: 2.5 });
      }
      function bloque(x, y, l1, sim, color, v) {
        const a = al(v), w = 120, h = 52;
        caja(ctx, x - w / 2, y - h / 2, w, h, { r: 9, fill: v > 0 ? alfa(color, 0.13 * v) : '#ffffff', stroke: alfa(color, a), lw: 1.8 + 1.6 * v });
        text(ctx, l1, x, y - 4, { color: alfa(color, a), size: 12.5, weight: '600', align: 'center' });
        K.rich(ctx, sim, x, y + 17, { color: alfa(color, a), size: 15, align: 'center' });
      }
      const lin = (pts, v, color = C.grey) => flecha(ctx, pts, v > 0.02 ? alfa(C.navy, al(v)) : alfa(color, BASE), { lw: 1.8 + 1.2 * v, cabeza: 6 + 2 * v });
      const simb = (x, y, s, color, v) => K.rich(ctx, s, x, y + 6, { color: alfa(color, al(v)), size: 18 + 2 * v, align: 'center' });
      // entradas
      miniatura(XL - S / 2, 'ctx', A('thumbC')); miniatura(XR - S / 2, 'obj', A('thumbT'));
      const lb = grilla ? ['parches + posición', 'parches + posición'] : ['contexto', 'imagen completa'];
      text(ctx, lb[0], XL, TY + S + 22, { color: alfa(grilla ? C.navy : C.teal, al(A('thumbC'))), size: 12, weight: '600', align: 'center' });
      text(ctx, lb[1], XR, TY + S + 22, { color: alfa(grilla ? C.navy : C.coralD, al(A('thumbT'))), size: 12, weight: '600', align: 'center' });
      // rama de contexto
      lin([[XL, TY - 6], [XL, yE + 28]], A('aC')); bloque(XL, yE, 'encoder contexto', '$f_\\theta$', C.teal, A('encC'));
      lin([[XL, yE - 28], [XL, yS + 14]], A('aSx')); simb(XL, yS, '$s_x$', C.teal, A('sx'));
      lin([[XL, yS - 14], [XL, yP + 28]], A('aP')); bloque(XL, yP, 'predictor', '$g_\\phi$', C.blue, A('pred'));
      lin([[XL, yP - 28], [XL, yH + 14]], A('aH')); simb(XL, yH, '$\\hat s_y$', C.blue, A('sh'));
      // rama objetivo
      lin([[XR, TY - 6], [XR, yE + 28]], A('aT')); bloque(XR, yE, 'encoder objetivo', '$f_{\\bar\\theta}$', C.navy, A('encT'));
      lin([[XR, yE - 28], [XR, yH + 14]], A('aSy')); simb(XR, yH, '$s_y$', C.coralD, A('sy'));
      // EMA
      const ve = A('ema');
      ctx.setLineDash([5, 4]); flecha(ctx, [[XL + 62, yE], [XR - 62, yE]], alfa(ve > 0.02 ? C.navy : C.grey2, al(ve)), { lw: 1.6 + 1.2 * ve, cabeza: 6 }); ctx.setLineDash([]);
      text(ctx, 'EMA', XM, yE - 7, { color: alfa(ve > 0.02 ? C.navy : C.grey2, al(ve)), size: 12, weight: '700', align: 'center' });
      // posiciones de los objetivos
      const vp = A('pos');
      flecha(ctx, [[XR - 18, yP], [XL + 62, yP]], alfa(C.coralD, al(vp)), { lw: 1.6 + 1.2 * vp, cabeza: 6 });
      text(ctx, 'posiciones', XM + 26, yP - 8, { color: alfa(C.coralD, al(vp)), size: 12, weight: vp > 0.5 ? '700' : '400', align: 'center' });
      // pérdida
      const vd = A('D');
      lin([[XL, yH - 14], [XL, yD], [XM - 20, yD]], A('dL')); lin([[XR, yH - 14], [XR, yD], [XM + 20, yD]], A('dL'));
      ctx.fillStyle = vd > 0 ? alfa(C.coral, 0.25 * vd) : '#ffffff'; ctx.strokeStyle = alfa(C.coralD, al(vd)); ctx.lineWidth = 2 + 1.5 * vd;
      ctx.beginPath(); ctx.arc(XM, yD, 18, 0, 7); ctx.fill(); ctx.stroke();
      text(ctx, 'D', XM, yD + 6, { color: alfa(C.coralD, al(vd)), size: 16, weight: '700', align: 'center' });
      // gradiente (sólo en la pasada completa)
      const vg = A('grad');
      if (vg > 0.02) {
        ctx.setLineDash([6, 4]);
        const xg = XL - 78;
        flecha(ctx, [[XM - 18, yD - 6], [xg, yD - 6], [xg, yP], [XL - 62, yP]], alfa(C.coralD, vg), { lw: 2.4, cabeza: 8 });
        flecha(ctx, [[xg, yP], [xg, yE], [XL - 62, yE]], alfa(C.coralD, vg), { lw: 2.4, cabeza: 8 });
        ctx.setLineDash([]);
        text(ctx, 'gradiente', xg - 6, yD - 14, { color: alfa(C.coralD, vg), size: 13, weight: '700' });
        ctx.strokeStyle = alfa(C.coralD, vg); ctx.lineWidth = 2.4;
        const xs = XR + 26, ys = yH;   // s_y sin gradiente
        ctx.beginPath(); ctx.moveTo(xs - 7, ys - 7); ctx.lineTo(xs + 7, ys + 7); ctx.moveTo(xs + 7, ys - 7); ctx.lineTo(xs - 7, ys + 7); ctx.stroke();
      }
      ctx.restore();
    }
  })();

  // al costado de cada paso (data-paso 1..5): se prende cuando termina la animación del paso
  const ACT = {
    1: ['thumbC', 'thumbT'],
    2: ['thumbC', 'thumbT'],
    3: ['thumbC', 'aC', 'encC', 'aSx', 'sx'],
    4: ['thumbT', 'aT', 'encT', 'aSy', 'sy'],
    5: ['sx', 'aP', 'pred', 'pos', 'aH', 'sh'],
    6: ['sh', 'sy', 'dL', 'D'],
    7: ['D', 'grad', 'pred', 'encC'],
    8: ['ema', 'encC', 'encT']
  };
  K.register('mapaJepa', root => {
    const cv = root.querySelector('canvas'), { ctx, W, H } = setupCanvas(cv);
    const paso = +root.dataset.paso || 0;
    // el resaltado se prende apenas la animación principal llega a su última parada (sin esperar a que
    // termine de moverse: el último tramo dura hasta 2,6 s y al ritmo de una charla se pasaba de slide
    // antes de verlo, así que sólo aparecía al volver para atrás). Al entrar a la slide arranca ya en su
    // valor (apagado si se llega avanzando, prendido si se vuelve), sin arrastrar el de la visita anterior.
    let hl = 0;
    Object.defineProperty(root, '_hl', { get: () => hl, configurable: true });
    const terminado = () => {
      const cm = root.closest('.con-mapa'), main = cm && cm.querySelector('.paso-main .ot-widget'), P = main && main._pasos;
      return !P || P.i >= P.stops.length - 1;
    };
    root._entrar = () => { hl = terminado() ? 1 : 0; };
    K.frame(root, (now, dt) => {
      hl += ((terminado() ? 1 : 0) - hl) * (1 - Math.exp(-dt / 130)); if (Math.abs(hl - Math.round(hl)) < 0.01) hl = Math.round(hl);
      const act = {}; (ACT[paso] || []).forEach(k => { act[k] = hl; });
      ctx.clearRect(0, 0, W, H);
      MAPA.dibujar(ctx, 0, 0, act, { grilla: paso === 1 });
      text(ctx, 'I-JEPA', 16, 22, { color: C.grey2, size: 13, weight: '600' });
    });
  });

  // una pasada completa de entrenamiento, por pasos
  K.register('pasada', root => {
    const cv = root.querySelector('canvas'), { ctx, W, H } = setupCanvas(cv);
    const SC = 0.84, OX = 150, OY = (H - 500 * SC) / 2 + 4;
    const ITEMS = ['Tokens', 'Máscaras', 'Encoder de contexto', 'Encoder objetivo', 'Predictor', 'Pérdida', 'Gradiente y EMA'];
    const DESC = ['La imagen se corta en parches y cada uno lleva su posición.',
      'Se sortean un bloque de contexto y varios bloques objetivo.',
      'Procesa sólo los tokens de contexto y da $s_x$.',
      'Procesa la imagen entera; se recortan los objetivos $s_y$.',
      'Con $s_x$ y la posición de cada objetivo, predice $\\hat s_y$.',
      'Distancia entre $\\hat s_y$ y $s_y$, promediada sobre los objetivos.',
      'El gradiente actualiza el predictor y el encoder de contexto; $s_y$ no recibe gradiente.',
      'Después, el encoder objetivo se mueve hacia el de contexto por EMA.'];
    const draw = t => {
      ctx.clearRect(0, 0, W, H);
      const n = Math.round(t), f = 1 - Math.min(1, Math.abs(t - n) * 2);
      const act = {}; ACT[n + 1].forEach(k => { act[k] = f; });
      ctx.save(); ctx.scale(SC, SC);
      MAPA.dibujar(ctx, OX / SC, OY / SC, act, { grilla: n === 0 });
      ctx.restore();
      // lista de etapas
      const LX = 470, LY = 50, DY = 48;
      const item = Math.min(n, 6);
      ITEMS.forEach((tit, k) => {
        const on = k === item, ya = k < item, y = LY + k * DY;
        caja(ctx, LX, y - 15, 26, 26, { r: 7, fill: on ? C.blue : ya ? alfa(C.blue, 0.25) : '#ffffff', stroke: on || ya ? C.blue : C.grid, lw: 1.4 });
        text(ctx, String(k + 1), LX + 13, y + 4, { color: on ? '#fff' : ya ? C.blue : C.grey2, size: 13.5, weight: '700', align: 'center' });
        text(ctx, tit, LX + 40, y + 4, { color: on ? C.navy : ya ? alfa(C.navy, 0.6) : C.grey2, size: on ? 17 : 15, weight: on ? '700' : '600' });
        if (on) K.rich(ctx, DESC[n], LX + 40, y + 25, { color: C.navy, size: 14.5, align: 'left' });
      });
      text(ctx, 'Se repite en cada batch, con máscaras nuevas.', LX, H - 12, { color: C.grey2, size: 13.5 });
    };
    K.pasos(root, [0, 1, 2, 3, 4, 5, 6, 7], draw, { ms: 1400, max: 1400 });
  });

  // ============================================================ las tres arquitecturas
  K.register('tres', root => {
    const cv = root.querySelector('canvas'), { ctx, W, H } = setupCanvas(cv);
    const solo = root.dataset.solo;
    const nodo = (x, y, s, color, a) => K.rich(ctx, s, x, y + 7, { color: alfa(color, a), size: 21, align: 'center' });
    const red = (x, y, t, color, a, w = 104) => { caja(ctx, x - w / 2, y - 20, w, 40, { r: 9, fill: alfa('#ffffff', a), stroke: alfa(color, a), lw: 2.2 }); text(ctx, t, x, y + 6, { color: alfa(color, a), size: 14.5, weight: '600', align: 'center' }); };
    const lin = (pts, color, a) => flecha(ctx, pts, alfa(color, a), { lw: 2, cabeza: 7 });
    function columna(k, cx, a, activo) {
      const T = [['Joint-embedding', 'compara dos representaciones'], ['Generativa', 'reconstruye y en píxeles'], ['JEPA', 'predice la representación de y']][k];
      const EJ = ['SimCLR, DINO, iBOT…', 'MAE', 'I-JEPA'][k];
      const xl = cx - 78, xr = cx + 78, col = [C.blue, C.coralD, C.teal][k];
      text(ctx, T[0], cx, 30, { color: alfa(col, a), size: 20, weight: '600', align: 'center' });
      text(ctx, T[1], cx, 53, { color: alfa(C.grey2, a), size: 14.5, align: 'center' });
      nodo(xl, 352, '$x$', C.navy, a); nodo(xr, 352, '$y$', C.navy, a);
      const D = [cx, 106];
      if (k === 0) {
        lin([[xl, 338], [xl, 306]], C.grey, a); red(xl, 284, 'encoder', col, a); lin([[xl, 262], [xl, 222]], C.grey, a); nodo(xl, 204, '$s_x$', col, a);
        lin([[xr, 338], [xr, 306]], C.grey, a); red(xr, 284, 'encoder', col, a); lin([[xr, 262], [xr, 222]], C.grey, a); nodo(xr, 204, '$s_y$', col, a);
        lin([[xl, 188], [xl, 106], [cx - 28, 106]], C.grey, a); lin([[xr, 188], [xr, 106], [cx + 28, 106]], C.grey, a);
      } else if (k === 1) {
        lin([[xl, 338], [xl, 306]], C.grey, a); red(xl, 284, 'encoder', col, a); lin([[xl, 262], [xl, 232]], C.grey, a); red(xl, 210, 'decoder', col, a);
        lin([[xl, 188], [xl, 166]], C.grey, a); nodo(xl, 150, '$\\hat y$', col, a); lin([[xl, 134], [xl, 106], [cx - 28, 106]], C.grey, a);
        lin([[xr, 338], [xr, 106], [cx + 28, 106]], C.grey, a);
        nodo(xl - 86, 210, '$z$', C.grey2, a); lin([[xl - 74, 210], [xl - 56, 210]], C.grey, a);
      } else {
        lin([[xl, 338], [xl, 322]], C.grey, a); red(xl, 300, 'encoder', col, a); lin([[xl, 278], [xl, 264]], C.grey, a); nodo(xl, 248, '$s_x$', col, a);
        lin([[xl, 234], [xl, 218]], C.grey, a); red(xl, 196, 'predictor', C.blue, a); lin([[xl, 174], [xl, 160]], C.grey, a); nodo(xl, 144, '$\\hat s_y$', C.blue, a);
        lin([[xl, 130], [xl, 106], [cx - 28, 106]], C.grey, a);
        lin([[xr, 338], [xr, 322]], C.grey, a); red(xr, 300, 'encoder', col, a); lin([[xr, 278], [xr, 222]], C.grey, a); nodo(xr, 204, '$s_y$', col, a);
        lin([[xr, 188], [xr, 106], [cx + 28, 106]], C.grey, a);
        nodo(xl - 86, 196, '$z$', C.grey2, a); lin([[xl - 74, 196], [xl - 56, 196]], C.grey, a);
        if (!solo || solo === 'jepa') text(ctx, 'posición', xl - 86, 222, { color: alfa(C.grey2, a), size: 12, align: 'center' });
      }
      ctx.fillStyle = alfa(activo ? C.coral : '#ffffff', a); ctx.strokeStyle = alfa(C.coralD, a); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(D[0], D[1], 22, 0, 7); ctx.fill(); ctx.stroke();
      text(ctx, 'D', D[0], D[1] + 7, { color: alfa(activo ? '#ffffff' : C.coralD, a), size: 18, weight: '700', align: 'center' });
      text(ctx, k === 1 ? 'distancia en píxeles' : 'distancia entre representaciones', cx, 74, { color: alfa(C.coralD, a), size: 13.5, weight: '600', align: 'center' });
      text(ctx, EJ, cx, 388, { color: alfa(C.grey2, a), size: 14, align: 'center' });
    }
    const draw = t => {
      ctx.clearRect(0, 0, W, H);
      const act = solo !== undefined ? +solo : Math.round(t);
      [0, 1, 2].forEach(k => { const v = solo !== undefined ? (k === act ? 1 : 0) : clamp(1 - Math.abs(t - k), 0, 1); columna(k, 190 + k * 360, 0.32 + 0.68 * v, k === act); });
      ctx.strokeStyle = C.grid; ctx.lineWidth = 1.5; for (const x of [370, 730]) { ctx.beginPath(); ctx.moveTo(x, 20); ctx.lineTo(x, H - 16); ctx.stroke(); }
    };
    if (solo !== undefined) draw(0);
    else K.pasos(root, [0, 1, 2], draw, { ms: 700 });
  });

  // ============================================================ resultados reportados
  K.register('resultados', root => {
    const cv = root.querySelector('canvas'), { ctx, W, H } = setupCanvas(cv);
    // [método, arquitectura, valor, grupo (0 sin aumentos, 1 con aumentos), nota]
    const V = {
      lineal: { titulo: 'Evaluación lineal en ImageNet-1k (top-1, %)', min: 74, max: 83, filas: [
        ['MAE', 'ViT-H/14', 77.2, 0, '1600 épocas'], ['data2vec', 'ViT-L/16', 77.3, 0, '1600 épocas'], ['CAE', 'ViT-L/16', 78.1, 0, '1600 épocas'],
        ['I-JEPA', 'ViT-H/14', 79.3, 0, '300 épocas'], ['I-JEPA', 'ViT-H/16 a 448 px', 81.1, 0, '300 épocas'],
        ['SimCLR v2', 'RN152 (2×)', 79.1, 1, '800 épocas'], ['DINO', 'ViT-B/8', 80.1, 1, '300 épocas'], ['iBOT', 'ViT-L/16', 81.0, 1, '250 épocas']] },
      uno: { titulo: 'ImageNet con el 1 % de las etiquetas: lo mejor entre fine-tuning y lineal (I-JEPA: fine-tuning)', min: 66, max: 79, filas: [
        ['MAE', 'ViT-H/14', 71.5, 0, ''], ['data2vec', 'ViT-L/16', 73.3, 0, ''],
        ['I-JEPA', 'ViT-H/14', 73.3, 0, ''], ['I-JEPA', 'ViT-H/16 a 448 px', 77.3, 0, ''],
        ['iBOT', 'ViT-B/16', 69.7, 1, ''], ['DINO', 'ViT-B/8', 70.0, 1, ''], ['MSN', 'ViT-B/4', 75.7, 1, '']] },
      bajo: { titulo: 'Tarea de bajo nivel: profundidad en Clevr/Dist (lineal, %)', min: 50, max: 76, filas: [
        ['data2vec', 'ViT-L/16', 71.3, 0, 'conteo 85,3'], ['MAE', 'ViT-H/14', 72.4, 0, 'conteo 90,5'], ['I-JEPA', 'ViT-H/14', 72.4, 0, 'conteo 86,7'],
        ['DINO', 'ViT-B/8', 53.4, 1, 'conteo 86,6'], ['iBOT', 'ViT-L/16', 62.8, 1, 'conteo 85,7']] } };
    let vista = root.dataset.vista || 'lineal', crece = 0;
    function draw() {
      ctx.clearRect(0, 0, W, H);
      const D = V[vista], X0 = 330, X1 = 960, X = v => X0 + (v - D.min) / (D.max - D.min) * (X1 - X0), g = ease(crece);
      text(ctx, D.titulo, 30, 32, { color: C.navy, size: 19, weight: '600' });
      const paso = D.filas.length > 7 ? 37 : D.filas.length > 5 ? 41 : 50; let y = 62, grupo = -1;
      const yEje = 62 + D.filas.length * paso + 2 * 28;
      ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
      for (let v = Math.ceil(D.min / 2) * 2; v <= D.max; v += (D.max - D.min > 15 ? 4 : 2)) { ctx.beginPath(); ctx.moveTo(X(v), 52); ctx.lineTo(X(v), yEje - 6); ctx.stroke(); text(ctx, String(v), X(v), yEje + 12, { color: C.grey, size: 13, align: 'center' }); }
      for (const f of D.filas) {
        if (f[3] !== grupo) { grupo = f[3]; text(ctx, grupo ? 'Con aumentos de vista diseñados a mano' : 'Sin aumentos de vista diseñados a mano', 30, y + 18, { color: C.grey2, size: 13.5, weight: '600' }); y += 28; }
        const yo = y + paso / 2, ij = f[0] === 'I-JEPA', col = ij ? C.coralD : grupo ? C.grey : C.blue, xv = X0 + (X(f[2]) - X0) * g;
        text(ctx, f[0], 30, yo + 5, { color: ij ? C.coralD : C.navy, size: 16, weight: ij ? '700' : '600' });
        text(ctx, f[1], 140, yo + 5, { color: C.grey2, size: 14 });
        ctx.strokeStyle = alfa(col, 0.45); ctx.lineWidth = ij ? 4 : 2.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(X0, yo); ctx.lineTo(xv, yo); ctx.stroke();
        dot(ctx, xv, yo, col, ij ? 9 : 7);
        text(ctx, num(f[2]), xv + 16, yo + 5, { color: ij ? C.coralD : C.navy, size: 16, weight: ij ? '700' : '600' });
        if (f[4]) text(ctx, f[4], xv + 62, yo + 5, { color: C.grey2, size: 13.5 });
        y += paso;
      }
      text(ctx, 'el eje no empieza en cero', X1, 32, { color: C.grey, size: 13, align: 'right' });
    }
    const b = K.bar(root);
    K.opciones(b, [['lineal', 'evaluación lineal'], ['uno', '1 % de etiquetas'], ['bajo', 'bajo nivel']], vista, v => { vista = v; crece = 0; });
    K.hint(b, 'números de las tablas 1, 2 y 4 del paper');
    root._entrar = () => { crece = 0; };
    K.frame(root, (now, dt) => { crece = Math.min(1, crece + dt / 900); draw(); });
    crece = 1; draw();
  });

  // ============================================================ la arquitectura cognitiva de LeCun (2022)
  K.register('mundo', root => {
    const cv = root.querySelector('canvas'), { ctx, W, H } = setupCanvas(cv);
    const M = [
      { n: 'Configurador', x: 410, y: 22, w: 280, h: 52, rol: 'Control ejecutivo: prepara a los demás módulos para la tarea que toca.' },
      { n: 'Percepción', x: 40, y: 150, w: 210, h: 70, rol: 'Estima el estado actual del mundo a partir de los sensores.' },
      { n: 'Modelo del mundo', x: 445, y: 140, w: 210, h: 90, rol: 'Completa lo que no se observa y predice estados futuros, incluidos los que resultan de una acción.' },
      { n: 'Costo', x: 850, y: 150, w: 210, h: 70, s: 'intrínseco + crítico', rol: 'Mide el «malestar» en un número: un costo intrínseco fijo y un crítico entrenable que lo anticipa.' },
      { n: 'Actor', x: 850, y: 280, w: 210, h: 60, rol: 'Propone secuencias de acciones que minimizan el costo futuro estimado.' },
      { n: 'Memoria de corto plazo', x: 430, y: 284, w: 240, h: 52, rol: 'Guarda el estado actual y los predichos, junto con sus costos.' }];
    const fijo = root.dataset.fijo;
    const draw = t => {
      ctx.clearRect(0, 0, W, H);
      const act = fijo !== undefined ? +fijo : Math.min(5, Math.floor(t));
      const g = C.grey;
      // el configurador modula a todos
      for (const p of [[[410, 48], [145, 48], [145, 146]], [[550, 74], [550, 136]], [[690, 48], [955, 48], [955, 146]], [[955, 48], [1084, 48], [1084, 310], [1064, 310]]])
        flecha(ctx, p, alfa(g, 0.8), { lw: 1.6, dash: [4, 5], cabeza: 7 });
      flecha(ctx, [[250, 185], [441, 185]], C.navy); text(ctx, 'estado', 345, 176, { color: C.grey2, size: 13.5, align: 'center' });
      flecha(ctx, [[655, 170], [846, 170]], C.navy); text(ctx, 'estados predichos', 750, 161, { color: C.grey2, size: 13.5, align: 'center' });
      flecha(ctx, [[955, 220], [955, 276]], C.navy); text(ctx, 'costo', 965, 254, { color: C.grey2, size: 13.5 });
      flecha(ctx, [[850, 310], [740, 310], [740, 210], [659, 210]], C.navy); text(ctx, 'acciones propuestas', 750, 330, { color: C.grey2, size: 13.5, align: 'center' });
      flecha(ctx, [[550, 280], [550, 234]], C.navy, { lw: 2 }); flecha(ctx, [[530, 230], [530, 280]], C.navy, { lw: 2 });
      text(ctx, 'sensores', 145, 262, { color: C.grey2, size: 13.5, align: 'center' }); flecha(ctx, [[145, 246], [145, 224]], C.grey, { lw: 2 });
      M.forEach((m, k) => {
        const on = k === act, mundo = k === 2;
        caja(ctx, m.x, m.y, m.w, m.h, { r: 12, fill: on ? (mundo ? '#fff6f5' : '#f1f8f7') : '#ffffff', stroke: on ? (mundo ? C.coralD : C.teal) : mundo ? C.coral : C.blue, lw: on ? 4 : 2.2 });
        text(ctx, m.n, m.x + m.w / 2, m.y + m.h / 2 + (m.s || mundo ? -3 : 6), { color: mundo ? C.coralD : C.navy, size: 17, weight: '600', align: 'center' });
        if (m.s) text(ctx, m.s, m.x + m.w / 2, m.y + m.h / 2 + 18, { color: C.grey2, size: 13.5, align: 'center' });
        if (mundo) text(ctx, 'acá entra JEPA', m.x + m.w / 2, m.y + m.h / 2 + 20, { color: C.coralD, size: 13.5, weight: '600', align: 'center' });
      });
      const m = M[act];
      caja(ctx, 40, 362, W - 80, 54, { r: 10, fill: C.light });
      text(ctx, m.n, 60, 385, { color: act === 2 ? C.coralD : C.teal, size: 17, weight: '600' });
      ctx.font = '600 17px ' + K.FONT; const w0 = ctx.measureText(m.n).width;
      parrafo(ctx, m.rol, 60 + w0 + 16, 385, W - 140 - w0, { color: C.text, size: 15.5 });
    };
    if (fijo !== undefined) draw(0);
    else { let t0 = 0; root._entrar = now => { t0 = now; }; K.frame(root, now => draw(((now - t0) / 3000) % 6)); draw(0); }
  });
})();
</script>
